<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offer Tracker · 秋招作战板</title>
<!--
  ════════════════════════════════════════════════════════
  Offer Tracker（秋招作战板）· 单文件应用（无后端 / localStorage 存储）
  仓库: offer-tracker · 数据安全：全部存在本机浏览器 localStorage，
  可随时「导出备份」成 JSON；真实数据包 my-data.json 永不进仓库。
  演示模式：一键填充脱敏假数据，供作品集展示；清空即可恢复真实数据。

  ── 扩展指南（AI/未来维护者读这里）──
  ① 加/改状态列      → 只改 CONFIG.STAGES
  ② 加岗位字段       → 只改 CONFIG.FIELDS + renderForm 的表单生成
  ③ 加新视图/功能块  → 在 VIEWS 区加函数 + 在 renderMain 里挂载
  ④ 数据结构变更     → CONFIG.DATA_VERSION +1，在 STORE.migrate 里写迁移
  ════════════════════════════════════════════════════════
-->
<style>
  :root{
    --pink:#c2416b; --pink-deep:#993556; --pink-bg:#fff5f8; --pink-card:#ffe0ea; --card:#fff; --header-bg:rgba(255,245,248,.92);
    --ink:#3d2b33; --ink-mid:#7a5f6a; --ink-light:#a98e99;
    --ok:#3b6d11; --warn:#ba7517; --bad:#a32d2d; --info:#185fa5;
    --line:rgba(194,65,107,.15); --radius:12px;
  }
  body.dark{
    --pink-bg:#211a20; --pink-card:#3a2c34; --card:#332a31; --header-bg:rgba(28,22,27,.92);
    --ink:#f2e7ec; --ink-mid:#c9adba; --ink-light:#937a86;
    --line:rgba(224,138,165,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{background:var(--pink-bg);color:var(--ink);min-height:100vh;padding-bottom:60px}
  button{cursor:pointer;border:none;font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--pink)}

  /* ── header ── */
  header{position:sticky;top:0;z-index:20;background:var(--header-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;color:var(--pink-deep);font-weight:600}
  header .sub{font-size:12px;color:var(--ink-light)}
  .hbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--pink-deep);border-radius:8px;padding:7px 14px;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--pink);background:var(--pink-card)}
  .btn.primary{background:var(--pink);color:#fff;border-color:var(--pink)}
  .btn.primary:hover{background:var(--pink-deep)}
  .btn.danger{color:var(--bad)}
  .btn.small{padding:4px 10px;font-size:12px}

  /* ── 漏斗统计 ── */
  .funnel{display:flex;gap:6px;padding:14px 20px 4px;flex-wrap:wrap;align-items:center}
  .funnel .fcell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:86px}
  .funnel .fcell b{display:block;font-size:20px;color:var(--pink-deep)}
  .funnel .fcell span{font-size:11px;color:var(--ink-mid)}
  .funnel .frate{font-size:11px;color:var(--ink-light);padding:0 2px}

  /* ── 工具条 ── */
  .toolbar{display:flex;gap:10px;padding:10px 20px;flex-wrap:wrap;align-items:center}
  .toolbar input[type=search]{width:220px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--ink-mid)}
  .chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
  .chip.warn-dot::before{content:"●";color:var(--warn);margin-right:4px;font-size:9px}

  /* ── 看板 ── */
  .board{display:flex;gap:12px;padding:12px 20px;overflow-x:auto;align-items:flex-start}
  .col{min-width:240px;flex:0 0 240px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
  .col h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .col h3 .dot{width:8px;height:8px;border-radius:50%}
  .col h3 .cnt{margin-left:auto;font-size:11px;color:var(--ink-light);font-weight:400}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--pink);box-shadow:0 2px 8px rgba(194,65,107,.12)}
  .card .co{font-size:14px;font-weight:600}
  .card .role{font-size:12px;color:var(--ink-mid);margin:2px 0 6px}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
  .tag{border-radius:6px;padding:2px 7px;background:var(--pink-card);color:var(--pink-deep)}
  .tag.ddl-soon{background:#fdecea;color:var(--bad)}
  .tag.ddl-week{background:#faf0e0;color:var(--warn)}
  .tag.stale{background:#faf0e0;color:var(--warn)}
  .card .next{font-size:11px;color:var(--ink-light);margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
  .col .add{width:100%;background:none;border:1px dashed var(--line);border-radius:8px;color:var(--ink-light);padding:6px;font-size:12px}
  .col .add:hover{color:var(--pink);border-color:var(--pink)}

  /* ── 列表视图 ── */
  .listtable{width:calc(100% - 40px);margin:12px 20px;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;font-size:13px}
  .listtable th{background:var(--pink-card);color:var(--pink-deep);text-align:left;padding:9px 12px;font-size:12px;font-weight:600}
  .listtable td{padding:9px 12px;border-top:1px solid var(--line)}
  .listtable tr:hover td{background:var(--pink-bg)}
  .listtable tr{cursor:pointer}
  .st-badge{border-radius:6px;padding:2px 8px;font-size:11px;color:#fff;display:inline-block}

  /* ── 模态 ── */
  .mask{position:fixed;inset:0;background:rgba(61,43,51,.35);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:520px}
  .modal h2{font-size:16px;color:var(--pink-deep);margin-bottom:14px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-grid .full{grid-column:1/-1}
  .form-grid label{display:block;font-size:12px;color:var(--ink-mid);margin-bottom:4px}
  .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .hist{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  .hist li{list-style:none;font-size:12px;color:var(--ink-mid);padding:3px 0;display:flex;justify-content:space-between;gap:10px}
  .stageflow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .stageflow button{border-radius:8px;padding:5px 10px;font-size:12px;background:var(--pink-bg);border:1px solid var(--line);color:var(--ink-mid)}
  .stageflow button.cur{background:var(--pink);color:#fff;border-color:var(--pink)}
  .empty{padding:40px;text-align:center;color:var(--ink-light);font-size:13px}
  .qitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.6}
  .qmeta{font-size:12px;color:var(--ink-light);margin-top:4px}
  .empty b{color:var(--pink-deep)}
  .note{font-size:12px;color:var(--ink-light);padding:0 20px}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr}.toolbar input[type=search]{width:100%}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🎯 Offer Tracker <span style="font-size:13px;font-weight:400;color:var(--ink-light)">秋招作战板</span></h1>
    <div class="sub">岗位池 · 投递追踪 · 漏斗复盘 —— 数据只存本机浏览器，清缓存前先「导出备份」，换设备用「导入」搬家</div>
  </div>
  <div class="hbtns">
    <button class="btn primary" onclick="UI.openForm()">＋ 添加岗位</button>
    <button class="btn" onclick="IO.exportJSON()">导出备份</button>
    <button class="btn" onclick="IO.exportCSV()">导出CSV</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">导入</button>
    <button class="btn" onclick="UI.toggleDemoMenu(this)">演示</button>
    <button class="btn" id="themeBtn" onclick="THEME.toggle(this)">🌙</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="IO.importJSON(this)">
  </div>
</header>

<div id="main"></div>

<!-- 添加/编辑 岗位 -->
<div class="mask" id="formMask">
  <div class="modal">
    <h2 id="formTitle">添加岗位</h2>
    <div class="form-grid" id="formBody"></div>
    <div class="mbtns">
      <button class="btn" onclick="UI.closeForm()">取消</button>
      <button class="btn primary" onclick="UI.saveForm()">保存</button>
    </div>
  </div>
</div>

<!-- 岗位详情 -->
<div class="mask" id="detailMask">
  <div class="modal" id="detailBody"></div>
</div>

<!-- 演示菜单 -->
<div class="mask" id="demoMask" onclick="if(event.target===this)UI.close('demoMask')">
  <div class="modal" style="max-width:360px">
    <h2>演示模式</h2>
    <p style="font-size:13px;color:var(--ink-mid);line-height:1.7;margin-bottom:14px">
      用脱敏假数据填满看板，供作品集展示。<br>
      ⚠️ 填充会覆盖当前数据，请先「导出备份」。
    </p>
    <div class="mbtns" style="justify-content:flex-start">
      <button class="btn" onclick="DEMO.load();UI.close('demoMask')">填充演示数据</button>
      <button class="btn danger" onclick="IO.clearAll()">清空全部数据</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ═══════════ ① CONFIG 配置区（加状态/加字段只动这里） ═══════════ */
const CONFIG = {
  DATA_VERSION: 2,          // 数据结构版本：变更 +1 并在 STORE.migrate 写迁移
  LS_KEY: "job-tracker-v1",
  STALE_DAYS: 7,            // 已投后超过 N 天无状态变化 → 标「无进展」
  STAGES: [
    { id:"pool",      name:"待投递",   color:"#888780" },
    { id:"applied",   name:"已投递",   color:"#378ADD" },
    { id:"test",      name:"测评/笔试", color:"#BA7517" },
    { id:"interview", name:"面试中",   color:"#D4537E" },
    { id:"offer",     name:"Offer",   color:"#3B6D11" },
    { id:"rejected",  name:"挂了",     color:"#A32D2D" },
  ],
  // 表单字段：type 支持 text/select/date/textarea；span=2 占满一行
  FIELDS: [
    { key:"company",  label:"公司名称 *", type:"text",   required:true },
    { key:"role",     label:"岗位名称 *", type:"text",   required:true },
    { key:"city",     label:"城市",       type:"text" },
    { key:"channel",  label:"投递渠道",   type:"text",   ph:"官网 / BOSS / 内推…" },
    { key:"deadline", label:"网申截止 DDL", type:"date" },
    { key:"resume",   label:"简历版本",   type:"text",   ph:"如：A公司AI产品版 v3" },
    { key:"salary",   label:"薪资范围",   type:"text",   ph:"可不填" },
    { key:"status",   label:"当前状态",   type:"select", options:"STAGES" },
    { key:"next",     label:"下一步动作", type:"text",   span:2, ph:"如：等测评邮件 / 周五前催HR" },
    { key:"notes",    label:"备注（JD要点 / 内推人 / 注意事项）", type:"textarea", span:2, rows:3 },
  ],
};
const stageOf = id => CONFIG.STAGES.find(s=>s.id===id) || CONFIG.STAGES[0];

/* ═══════════ ② STORE 数据层（唯一入口，别绕过它改数据） ═══════════ */
const STORE = {
  data: { version: CONFIG.DATA_VERSION, jobs: [] },
  load(){
    try{ const raw = localStorage.getItem(CONFIG.LS_KEY);
      if(raw) this.data = this.migrate(JSON.parse(raw));
    }catch(e){ console.error("读取失败", e); }
    return this.data;
  },
  save(){ localStorage.setItem(CONFIG.LS_KEY, JSON.stringify(this.data)); },
  migrate(d){
    if(!d.version) d.version = 1;
    if(!Array.isArray(d.jobs)) d.jobs = [];
    if(d.version < 2) d.version = 2;            // v2：岗位新增 reviews（面试复盘），旧数据补空数组即可
    d.jobs.forEach(j=>{ if(!Array.isArray(j.reviews)) j.reviews = []; });
    return d;
  },
  add(job){
    job.id = Date.now() + "" + Math.floor(Math.random()*1e4);
    job.history = [{ status: job.status || "pool", at: new Date().toISOString() }];
    job.createdAt = job.updatedAt = new Date().toISOString();
    this.data.jobs.unshift(job); this.save();
  },
  update(id, patch, moveStatus){
    const j = this.data.jobs.find(x=>x.id===id); if(!j) return;
    const changed = moveStatus && moveStatus !== j.status; // 必须在合并前比较，否则旧状态被覆盖、历史永远不记
    Object.assign(j, patch);
    if(changed){
      j.status = moveStatus;
      j.history.push({ status: moveStatus, at: new Date().toISOString() });
    }
    j.updatedAt = new Date().toISOString();
    this.save();
  },
  remove(id){ this.data.jobs = this.data.jobs.filter(x=>x.id!==id); this.save(); },
  addReview(id, r){
    const j = this.data.jobs.find(x=>x.id===id); if(!j) return;
    if(!Array.isArray(j.reviews)) j.reviews = [];
    r.at = new Date().toISOString();
    j.reviews.unshift(r); this.save();
  },
  removeReview(id, idx){
    const j = this.data.jobs.find(x=>x.id===id); if(!j || !j.reviews) return;
    j.reviews.splice(idx, 1); this.save();
  },
  replaceAll(d){ this.data = this.migrate(d); this.save(); },
};

/* ═══════════ ③ 工具函数 ═══════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
function daysUntil(dateStr){ if(!dateStr) return null; return Math.round((new Date(dateStr+"T00:00:00") - today())/864e5); }
function daysSince(iso){ return Math.floor((today() - new Date(iso))/864e5); }
function fmtDate(iso){ return iso ? iso.slice(0,10) : "—"; }
function ddlTag(d){
  const n = daysUntil(d);
  if(n===null) return "";
  if(n<0)   return `<span class="tag ddl-soon">DDL已过 ${-n}天</span>`;
  if(n<=3)  return `<span class="tag ddl-soon">⏳还剩${n}天</span>`;
  if(n<=7)  return `<span class="tag ddl-week">还剩${n}天</span>`;
  return `<span class="tag">DDL ${d.slice(5)}</span>`;
}
function staleTag(j){
  // 已投/测评/面试中 且 状态更新超过 N 天 → 提示可催
  if(["pool","offer","rejected"].includes(j.status)) return "";
  const d = daysSince(j.updatedAt);
  return d >= CONFIG.STALE_DAYS ? `<span class="tag stale">已${d}天无进展</span>` : "";
}

/* ═══════════ ④ VIEWS 视图层 ═══════════ */
const VIEWS = {
  filter: { q:"", stage:"all" },

  visibleJobs(){
    const f = this.filter;
    return STORE.data.jobs.filter(j=>{
      if(f.stage!=="all" && j.status!==f.stage) return false;
      if(f.q && !(j.company+j.role+(j.notes||"")).toLowerCase().includes(f.q.toLowerCase())) return false;
      return true;
    });
  },

  funnel(){
    const jobs = STORE.data.jobs;
    const cnt = id => jobs.filter(j=>j.status===id).length;
    const cells = CONFIG.STAGES.map(s=>
      `<div class="fcell"><b style="color:${s.color}">${cnt(s.id)}</b><span>${s.name}</span></div>`);
    const applied = cnt("applied")+cnt("test")+cnt("interview")+cnt("offer")+cnt("rejected");
    const rate = (a,b)=> b? `→ ${Math.round(a/b*100)}%` : "";
    const rates = `<span class="frate">投出${applied} · 进面${cnt("interview")}<br>投→面 ${rate(cnt("interview"),applied)} · 面→offer ${rate(cnt("offer"),cnt("interview"))}</span>`;
    return `<div class="funnel">${cells.join('')}${rates}</div>`;
  },

  board(){
    const vis = this.visibleJobs();
    const cols = CONFIG.STAGES.map(s=>{
      const cards = vis.filter(j=>j.status===s.id).map(j=>this.card(j)).join("");
      return `<div class="col">
        <h3><span class="dot" style="background:${s.color}"></span>${s.name}
          <span class="cnt">${vis.filter(j=>j.status===s.id).length}</span></h3>
        ${cards || ""}
        <button class="add" onclick="UI.openForm(null,'${s.id}')">＋ 加到「${s.name}」</button>
      </div>`;
    }).join("");
    return `<div class="board">${cols}</div>`;
  },

  card(j){
    const st = stageOf(j.status);
    return `<div class="card" onclick="UI.openDetail('${j.id}')">
      <div class="co">${esc(j.company)}</div>
      <div class="role">${esc(j.role)}${j.city? " · "+esc(j.city):""}</div>
      <div class="meta">
        <span class="tag" style="background:${st.color}1a;color:${st.color}">${st.name}</span>
        ${ddlTag(j.deadline)}${staleTag(j)}${j.resume?`<span class="tag">📄${esc(j.resume)}</span>`:""}
      </div>
      ${j.next? `<div class="next">→ ${esc(j.next)}</div>`:""}
    </div>`;
  },

  table(){
    const vis = this.visibleJobs();
    if(!vis.length) return `<div class="empty">没有匹配的岗位</div>`;
    const rows = vis.map(j=>{
      const st = stageOf(j.status);
      return `<tr onclick="UI.openDetail('${j.id}')">
        <td><b>${esc(j.company)}</b></td><td>${esc(j.role)}</td><td>${esc(j.city||"—")}</td>
        <td>${esc(j.channel||"—")}</td><td>${j.deadline? esc(j.deadline):"—"}</td>
        <td>${j.appliedAt? esc(fmtDate(j.appliedAt)):"—"}</td>
        <td><span class="st-badge" style="background:${st.color}">${st.name}</span></td>
        <td>${esc(j.next||"—")}</td>
      </tr>`;
    }).join("");
    return `<table class="listtable"><thead><tr>
      <th>公司</th><th>岗位</th><th>城市</th><th>渠道</th><th>DDL</th><th>投递日</th><th>状态</th><th>下一步</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  },

  qbank(){
    // 题库：聚合所有岗位复盘里被问过的题，面试前按公司过一遍
    const items = [];
    STORE.data.jobs.forEach(j=>(j.reviews||[]).forEach(r=>
      (r.questions||[]).forEach(q=>items.push({q, co:j.company, round:r.round||"", date:r.date||fmtDate(r.at)}))));
    if(!items.length) return `<div class="empty" style="margin-top:40px">
      <div style="font-size:34px;margin-bottom:8px">🗂️</div><b>题库还是空的</b>
      <div style="font-size:12px;color:var(--ink-light);margin-top:6px">面试完打开对应岗位 → 「面试复盘」→ 添加复盘<br>被问倒的题会自动汇到这里，下次面试前过一遍</div></div>`;
    return `<div style="font-size:12px;color:var(--ink-light);margin-bottom:10px">共 ${items.length} 道被问过的题 · 下次面试前按公司过一遍</div>` +
      items.map(it=>`<div class="qitem"><div>${esc(it.q)}</div>
        <div class="qmeta">${esc(it.co)} · ${esc(it.round)} · ${esc(it.date)}</div></div>`).join("");
  },

  news(){
    const items = (NEWS.items||[]).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    return `<div style="font-size:12px;color:var(--ink-light);margin-bottom:10px">共 ${items.length} 条情报 · 由 AI 活动雷达定期更新</div>` +
      items.map(n=>`<div class="qitem">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${n.url? `<a href="${esc(n.url)}" target="_blank" rel="noopener" style="color:var(--pink-deep);text-decoration:none"><b>${esc(n.title)}</b></a>` : `<b>${esc(n.title)}</b>`}
          <span class="tag" style="margin-left:auto">${esc(n.tag||"情报")}</span>
        </div>
        ${n.note? `<div class="qmeta" style="margin-top:6px">${esc(n.note)}</div>`:""}
        <div class="qmeta">${esc(n.date||"")}${n.deadline? " · 截止 "+esc(n.deadline):""}</div>
      </div>`).join("");
  },
};

function renderMain(){
  const f = VIEWS.filter;
  // 空态引导：首次打开不显示空白看板，给三条开始路径（零摩擦）
  if(!STORE.data.jobs.length){
    $("#main").innerHTML = `<div class="empty" style="margin-top:60px">
      <div style="font-size:40px;margin-bottom:10px">🎯</div>
      <b style="font-size:16px">看板是空的，三种开始方式</b>
      <div style="margin:18px auto 8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" onclick="UI.openForm()">＋ 添加第一个岗位</button>
        <button class="btn" onclick="DEMO.load()">载入演示数据看看</button>
      </div>
      <div style="margin-top:12px">已有真实数据包（my-data.json）？点右上角「导入」选它，一键载入你的投递记录</div>
    </div>`;
    return;
  }
  const chips = [`<button class="chip ${f.stage==='all'?'on':''}" onclick="VIEWS.filter.stage='all';renderMain()">全部</button>`]
    .concat(CONFIG.STAGES.map(s=>
      `<button class="chip ${f.stage===s.id?'on':''}" onclick="VIEWS.filter.stage='${s.id}';renderMain()">${s.name}</button>`))
    .join("");
  const staleCount = STORE.data.jobs.filter(j=>staleTag(j)!=="").length;
  const staleChip = staleCount ? `<button class="chip warn-dot ${f.stage==='__stale'?'on':''}" onclick="VIEWS.filter.stage=VIEWS.filter.stage==='__stale'?'all':'__stale';renderMain()">需跟进 ${staleCount}</button>` : "";
  $("#main").innerHTML =
    VIEWS.funnel() +
    `<div class="toolbar">
      <input type="search" placeholder="搜公司 / 岗位 / 备注…" value="${esc(f.q)}"
        oninput="VIEWS.filter.q=this.value;renderResults()" style="caret-color:var(--pink)">
      ${chips}${staleChip}
      <span style="margin-left:auto"></span>
      <button class="btn small" onclick="VIEWS.filter.view='board';renderMain()">看板</button>
      <button class="btn small" onclick="VIEWS.filter.view='table';renderMain()">列表</button>
      <button class="btn small" onclick="VIEWS.filter.view='qbank';renderMain()">题库</button>
      <button class="btn small" id="newsBtn" style="display:none" onclick="VIEWS.filter.view='news';renderMain()">情报</button>
    </div>
    <div id="resultsArea"></div>`;
  NEWS.applyBtn();
  renderResults();
}
// 搜索时只重绘结果区，不动工具条 → 输入框光标/焦点不丢（踩坑库：全量重绘导致焦点/滚动丢失）
function renderResults(){
  const area = $("#resultsArea"); if(!area) return;
  area.innerHTML = VIEWS.filter.view==="table" ? VIEWS.table()
                 : VIEWS.filter.view==="qbank" ? VIEWS.qbank()
                 : VIEWS.filter.view==="news" ? VIEWS.news()
                 : VIEWS.board();
}
// 「需跟进」过滤：在 visibleJobs 里特判
const _origVisible = VIEWS.visibleJobs;
VIEWS.visibleJobs = function(){
  if(VIEWS.filter.stage==="__stale"){
    const f = VIEWS.filter;
    return STORE.data.jobs.filter(j=> staleTag(j)!==""
      && (!f.q || (j.company+j.role+(j.notes||"")).toLowerCase().includes(f.q.toLowerCase())));
  }
  return _origVisible.call(VIEWS);
};

/* ═══════════ ⑥ IO 导入导出 ═══════════ */
const IO = {
  exportJSON(){
    const blob = new Blob([JSON.stringify(STORE.data,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `job-tracker-备份-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  },
  importJSON(input){
    const file = input.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!confirm(`导入「${file.name}」会覆盖当前 ${STORE.data.jobs.length} 条岗位数据，继续？`)) return;
        STORE.replaceAll(d); renderMain(); alert("导入成功，共 "+d.jobs.length+" 条");
      }catch(e){ alert("文件格式不对，导入失败"); }
    };
    r.readAsText(file); input.value="";
  },
  buildCSV(){
    // \ufeff BOM 让 Excel 正确识别 UTF-8 中文
    const head = ["公司","岗位","城市","渠道","DDL","投递日","状态","下一步","薪资","简历版本","备注"];
    const rows = STORE.data.jobs.map(j=>[
      j.company, j.role, j.city||"", j.channel||"", j.deadline||"",
      j.appliedAt? String(j.appliedAt).slice(0,10) : "",
      stageOf(j.status).name, j.next||"", j.salary||"", j.resume||"", j.notes||""
    ]);
    return "\ufeff" + [head, ...rows].map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  },
  exportCSV(){
    const blob = new Blob([this.buildCSV()], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `offer-tracker-${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  },
  clearAll(){
    if(!confirm("确定清空全部岗位数据？此操作不可恢复（建议先导出备份）")) return;
    STORE.replaceAll({ version:CONFIG.DATA_VERSION, jobs:[] }); renderMain();
  },
};

/* ═══════════ 启动 ═══════════ */
const THEME = {
  get(){ try{ return localStorage.getItem("ot-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }catch(e){ return "light"; } },
  set(t){ try{ localStorage.setItem("ot-theme", t); }catch(e){} document.body.classList.toggle("dark", t==="dark"); },
  toggle(btn){ const t = this.get()==="dark" ? "light" : "dark"; this.set(t); btn.textContent = t==="dark" ? "☀️" : "🌙"; },
};
const NEWS = {
  items: null,
  load(){
    // 安静挂法：news.json 不存在/为空 → 情报按钮永远不出现，不占界面
    fetch("news.json").then(r=>r.ok ? r.json() : Promise.reject())
      .then(d=>{ this.items = Array.isArray(d) ? d : (d.items||[]); this.applyBtn(); })
      .catch(()=>{ this.items = []; });
  },
  applyBtn(){
    // renderMain 每次重建工具栏会把按钮重置为隐藏，所以每次渲染后都要重放显隐状态
    const b = document.getElementById("newsBtn");
    if(b && this.items && this.items.length) b.style.display = "";
  },
};
THEME.set(THEME.get());
document.getElementById("themeBtn").textContent = THEME.get()==="dark" ? "☀️" : "🌙";
