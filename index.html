<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offer Tracker · 秋招作战板</title>
<!--
  ════════════════════════════════════════════════════════
  Offer Tracker（秋招作战板）· 单文件应用（无后端 / localStorage 存储）
  仓库: offer-tracker · 数据安全：全部存在本机浏览器 localStorage，
  可随时「导出备份」成 JSON；真实数据包 my-data.json 永不进仓库。
  演示模式：一键填充脱敏假数据，供作品集展示；清空即可恢复真实数据。

  ── 扩展指南（AI/未来维护者读这里）──
  ① 加/改状态列      → 只改 CONFIG.STAGES
  ② 加岗位字段       → 只改 CONFIG.FIELDS + renderForm 的表单生成
  ③ 加新视图/功能块  → 在 VIEWS 区加函数 + 在 renderMain 里挂载
  ④ 数据结构变更     → CONFIG.DATA_VERSION +1，在 STORE.migrate 里写迁移
  ════════════════════════════════════════════════════════
-->
<style>
  :root{
    /* ── UI v2 规范（2026-09-07 定稿）· 暖白底 + 樱花粉唯一强调 ── */
    --paper:#F5F4F0; --paper-2:#EFEEE9; --paper-3:#EAE8E2; --card:#FFFFFF; --header-bg:rgba(245,244,240,.94);
    --ink:#3a2a30; --ink-mid:#7a6a72; --ink-light:#9a7a85;
    --brand:#c2416b; --brand-deep:#a83358; --brand-soft:#fdeef3;
    --accent:#D4537E; --accent-deep:#b83f66; --accent-soft:#fbe4ec;
    --ok:#639922; --warn:#BA7517; --bad:#E24B4A; --info:#378ADD;
    --line:rgba(58,42,48,.12); --line-strong:rgba(58,42,48,.20);
    /* 圆角三级制：卡片 18 / 控件 8 / 药丸全圆 */
    --radius:14px; --radius-card:18px; --radius-btn:8px; --radius-pill:9999px;
    /* 兼容旧名，原有样式自动跟随新主题 */
    --pink:var(--brand); --pink-deep:var(--brand-deep); --pink-bg:var(--paper); --pink-card:var(--paper-3);
  }
  body.dark{
    --paper:#232022; --paper-2:#2B2729; --paper-3:#332E31; --card:#2C282B; --header-bg:rgba(35,32,34,.94);
    --ink:#EFE7EA; --ink-mid:#B5A8AE; --ink-light:#8A7C83;
    --brand:#E06A90; --brand-deep:#C9537A; --brand-soft:#3A2A31;
    --accent:#E06A90; --accent-deep:#C9537A; --accent-soft:#3A2A31;
    --ok:#8CBF55; --warn:#D9A34A; --bad:#E87A78; --info:#6BA5E8;
    --line:rgba(239,231,234,.14); --line-strong:rgba(239,231,234,.24);
    /* 别名必须在 body.dark 重定义一次：:root 上的 var() 引用在 html 层就解析了，body 换 --paper 影响不到它们 */
    --pink:var(--brand); --pink-deep:var(--brand-deep); --pink-bg:var(--paper); --pink-card:var(--paper-3);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{background:var(--pink-bg);color:var(--ink);min-height:100vh;padding-bottom:60px}
  button{cursor:pointer;border:none;font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);outline:none;width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--pink)}

  /* ── header ── */
  header{position:sticky;top:0;z-index:20;background:var(--header-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;color:var(--pink-deep);font-weight:600}
  header .sub{font-size:12px;color:var(--ink-light)}
  .hbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:var(--card);border:1px solid var(--line);color:var(--pink-deep);border-radius:8px;padding:7px 14px;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--pink);background:var(--pink-card)}
  .btn.primary{background:var(--pink);color:#fff;border-color:var(--pink)}
  .btn.primary:hover{background:var(--pink-deep)}
  .btn.danger{color:var(--bad)}
  .btn.small{padding:4px 10px;font-size:12px}

  /* ── 漏斗统计 ── */
  .funnel{display:flex;gap:6px;padding:14px 20px 4px;flex-wrap:wrap;align-items:center}
  .funnel .fcell{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:86px}
  .funnel .fcell b{display:block;font-size:20px;color:var(--pink-deep)}
  .funnel .fcell span{font-size:11px;color:var(--ink-mid)}
  .funnel .frate{font-size:11px;color:var(--ink-light);padding:0 2px}

  /* ── 工具条 ── */
  .toolbar{display:flex;gap:10px;padding:10px 20px;flex-wrap:wrap;align-items:center}
  .toolbar input[type=search]{width:220px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--ink-mid)}
  .chip.on{background:var(--pink);color:#fff;border-color:var(--pink)}
  .chip.warn-dot::before{content:"●";color:var(--warn);margin-right:4px;font-size:9px}

  /* ── 看板 ── */
  .board{display:flex;gap:12px;padding:12px 20px;overflow-x:auto;align-items:flex-start}
  .col{min-width:240px;flex:0 0 240px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
  .col h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .col h3 .dot{width:8px;height:8px;border-radius:50%}
  .col h3 .cnt{margin-left:auto;font-size:11px;color:var(--ink-light);font-weight:400}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:.15s;position:relative}
  .card:hover{border-color:var(--pink);box-shadow:0 2px 8px rgba(194,65,107,.12)}
  .card .co{font-size:14px;font-weight:600}
  .card .role{font-size:12px;color:var(--ink-mid);margin:2px 0 6px}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
  .tag{border-radius:6px;padding:2px 7px;background:var(--pink-card);color:var(--pink-deep)}
  .tag.ddl-soon{background:#fdecea;color:var(--bad)}
  .tag.ddl-week{background:#faf0e0;color:var(--warn)}
  .tag.stale{background:#faf0e0;color:var(--warn)}
  .card .next{font-size:11px;color:var(--ink-light);margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
  .col .add{width:100%;background:none;border:1px dashed var(--line);border-radius:8px;color:var(--ink-light);padding:6px;font-size:12px}
  .col .add:hover{color:var(--pink);border-color:var(--pink)}

  /* ── 列表视图 ── */
  .listtable{width:calc(100% - 40px);margin:12px 20px;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;font-size:13px}
  .listtable th{background:var(--pink-card);color:var(--pink-deep);text-align:left;padding:9px 12px;font-size:12px;font-weight:600}
  .listtable td{padding:9px 12px;border-top:1px solid var(--line)}
  .listtable tr:hover td{background:var(--pink-bg)}
  .listtable tr{cursor:pointer}
  .st-badge{border-radius:6px;padding:2px 8px;font-size:11px;color:#fff;display:inline-block}

  /* ── 模态 ── */
  .mask{position:fixed;inset:0;background:rgba(61,43,51,.35);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .mask.show{display:flex}
  .modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:520px}
  .modal h2{font-size:16px;color:var(--pink-deep);margin-bottom:14px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-grid .full{grid-column:1/-1}
  .form-grid label{display:block;font-size:12px;color:var(--ink-mid);margin-bottom:4px}
  .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .hist{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  .hist li{list-style:none;font-size:12px;color:var(--ink-mid);padding:3px 0;display:flex;justify-content:space-between;gap:10px}
  .stageflow{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .stageflow button{border-radius:8px;padding:5px 10px;font-size:12px;background:var(--pink-bg);border:1px solid var(--line);color:var(--ink-mid)}
  .stageflow button.cur{background:var(--pink);color:#fff;border-color:var(--pink)}
  .empty{padding:40px;text-align:center;color:var(--ink-light);font-size:13px}
  .qitem{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;font-size:13px;line-height:1.6}
  .qmeta{font-size:12px;color:var(--ink-light);margin-top:4px}
  .empty b{color:var(--pink-deep)}
  .note{font-size:12px;color:var(--ink-light);padding:0 20px}
  /* ── 月历小卡（有事件才标记，点日期内联展开） ── */
  .calwrap{max-width:920px;margin:14px auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px}
  .cal-head{display:flex;align-items:center;gap:6px;margin-bottom:12px}
  .cal-head b{font-size:16px;color:var(--brand-deep);margin:0 6px}
  .cal-nav{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-btn);width:30px;height:30px;color:var(--ink-mid);line-height:1}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wd{font-size:12px;color:var(--ink-light);text-align:center;padding:4px 0}
  .cal-cell{min-height:74px;border-radius:var(--radius-btn);padding:5px 7px;font-size:13px;border:1px solid transparent;cursor:pointer;text-align:left;background:none;color:var(--ink)}
  .cal-cell:hover{background:var(--paper-2)}
  .cal-cell.blank{cursor:default;min-height:74px}
  .cal-cell.blank:hover{background:none}
  .cal-cell.today{border-color:var(--brand)}
  .cal-cell.sel{background:var(--brand-soft)}
  .cal-cell .cal-ev-mini{font-size:11px;border-radius:4px;padding:1px 5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;border:none;text-align:left;width:100%;cursor:pointer}
  .cal-cell .dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
  .cal-cell .dots i{width:5px;height:5px;border-radius:50%;display:inline-block}
  .cal-panel{margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:8px}
  .cal-ev{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-btn);font-size:13px;cursor:pointer}
  .cal-ev:hover{background:var(--paper-2)}
  .cal-ev .cdot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .cal-ev .ct{margin-left:auto;font-size:11px;color:var(--ink-light)}
  /* ── AI 区块 ── */
  .ai-box{background:var(--pink-bg);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;line-height:1.75;white-space:pre-wrap;color:var(--ink)}
  body.dark .ai-box{background:rgba(224,138,165,.08)}
  .ai-status{font-size:12px;color:var(--ink-mid);margin-top:6px;min-height:14px}
  .ai-status.err{color:var(--bad)}
  .qrow{display:flex;align-items:flex-start;gap:8px;margin-top:6px}
  .qrow .qt{flex:1}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr}.toolbar input[type=search]{width:100%}}

  /* ══════════ UI v2 · Paper Ledger → Warm-white spec (2026-09-07 定稿) ══════════ */
  /* A 暖白底，无纹理（规范：#F5F4F0 替代纯白，不加装饰底纹） */

  /* B·D 三级圆角制度：卡片 18 / 控件 8 / 药丸全圆 */
  .card,.col,.modal,.qitem,.listtable,.calwrap,.stat{border-radius:var(--radius-card)}
  .btn,.cal-nav,input,select,textarea{border-radius:var(--radius-btn)}
  .chip{border-radius:var(--radius-pill)}

  /* E 按钮：克制 hover——背景只提一级，不变色不加动画 */
  .btn{box-shadow:0 1px 0 var(--line-strong)}
  .btn:hover{background:var(--paper-2)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:var(--brand-deep);color:#fff}

  /* C 状态用色点，不用彩色徽章 */
  .st-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 9px}
  .st-badge{background:none;color:var(--ink-mid);padding:0;display:inline-flex;align-items:center;gap:6px;font-size:12px}
  .tag{background:var(--paper-2);color:var(--ink-mid)}
  .tag.ddl-soon{background:#fbe4ec;color:var(--bad)}
  .tag.ddl-week{background:#faf0e0;color:var(--warn)}
  .tag.stale{background:var(--accent-soft);color:var(--accent-deep)}

  /* 大数字区 · 首屏唯一焦点（规范：40-48px，只放 3 个） */
  .stats{display:flex;gap:14px;padding:16px 20px 2px;flex-wrap:wrap;align-items:flex-end}
  .stat{background:none;border:none;padding:2px 0;min-width:132px;box-shadow:none}
  .stat .lb{font-size:12px;color:var(--ink-mid);margin-bottom:1px}
  .stat .nm{font-size:44px;font-weight:700;color:var(--ink);line-height:1.06;letter-spacing:-.02em}
  .stat.hl .nm{color:var(--brand)}
  .stat .sub2{font-size:11px;color:var(--ink-light);margin-top:2px}
  /* 今日焦点行：可点击数字，数据在它该在的位置（非提示条） */
  .focusline{display:flex;gap:8px;padding:10px 20px 0;flex-wrap:wrap;align-items:center}
  .focusline .fbtn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-pill);padding:4px 14px;font-size:12px;color:var(--ink-mid);display:inline-flex;align-items:center;gap:6px}
  .focusline .fbtn b{font-size:14px;color:var(--brand)}
  .focusline .fbtn:hover{border-color:var(--brand)}

  /* 看板：列固定 272px 横向滚动，绝不压缩 */
  .board{gap:14px;padding:14px 20px 20px}
  .col{min-width:272px;flex:0 0 272px;background:var(--paper-2);border:1px solid var(--line);padding:12px}
  .col h3{font-size:13px;margin:0 -12px 10px;padding:8px 14px;letter-spacing:.01em;background:none;border-top:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .col h3 .dot{width:9px;height:9px;border-radius:50%}
  .col h3 .cnt{color:var(--ink-light);font-weight:400}

  /* 卡片：左侧 3px 状态色条 + hover 背景提一级（不加浮起动画） */
  .card{border:1px solid var(--line);border-left:3px solid var(--st,var(--ink-light));padding:11px 13px;margin-bottom:9px;transition:border-color .14s,background .14s}
  .card:hover{background:var(--brand-soft);border-color:var(--line-strong);border-left-color:var(--st,var(--brand))}
  .card .co{font-size:14px;font-weight:600;letter-spacing:-.01em;padding-right:14px}
  .card .role{font-size:12.5px;color:var(--ink-mid);margin:1px 0 7px}
  .card .next{border-top:1px dashed var(--line-strong)}

  /* 0.5 小元素：需跟进 = 右上角「催」字陶土药丸（功能性标记，一眼可见） */
  .card.has-follow::after{content:"催";position:absolute;top:-6px;right:-4px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--radius-pill);box-shadow:0 1px 0 var(--accent-deep);letter-spacing:.05em}

  /* 拖拽换状态 */
  .col.drag-over{border-color:var(--brand);border-style:dashed;background:var(--brand-soft)}
  .card[draggable=true]:active{cursor:grabbing;opacity:.85}
  .board.drop-hint .col::before{content:"拖到目标列";display:block;text-align:center;font-size:11px;color:var(--ink-light);margin-bottom:6px}

  /* 头部等级条（游戏化，静默常驻） */
  .lvbar{display:flex;align-items:center;gap:10px;padding:8px 20px;background:var(--paper-2);border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
  .lvbar .lv{border:1px solid var(--line);color:var(--ink-mid);border-radius:var(--radius-pill);padding:2px 10px;font-weight:600;font-size:12px;white-space:nowrap}
  .lvbar .lvname{color:var(--brand-deep);font-weight:600;white-space:nowrap}
  .lvbar .track{flex:1;min-width:120px;height:6px;background:var(--paper-3);border-radius:var(--radius-pill);overflow:hidden}
  .lvbar .fill{height:100%;background:var(--brand);border-radius:var(--radius-pill);transition:width .4s}
  .lvbar .en{color:var(--accent-deep);font-weight:600;white-space:nowrap}

  /* 状态下拉（列表视图直改） */
  .st-select{font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:var(--radius-btn);background:var(--card);color:var(--ink);width:auto;cursor:pointer}

  /* 日程徽章 */
  .tag.ev{background:var(--brand-soft);color:var(--brand-deep)}

  .col .add{border-radius:var(--radius-btn)}
  .col .add:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip:hover{border-color:var(--brand)}
  .chip.warn-dot::before{color:var(--accent)}
  .funnel .fcell b{font-size:22px;color:var(--brand)}
  .listtable th{background:var(--paper-3);color:var(--ink)}
  .modal h2,.empty b{color:var(--brand-deep)}
  .stageflow button.cur{background:var(--brand);color:#fff;border-color:var(--brand)}
  .cal-cell.today{border-color:var(--brand)}
  .cal-cell.sel{background:var(--brand-soft)}
  .cal-head b{color:var(--brand-deep)}
  header h1{color:var(--brand-deep)}
  .ai-box{background:var(--paper-2)}
  .btn.more{padding:7px 11px;font-weight:600;letter-spacing:.08em}
  .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:0 8px 24px rgba(45,42,38,.14);padding:6px;min-width:168px;z-index:60;display:none}
  .menu.show{display:block}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 12px;font-size:13px;color:var(--ink);border-radius:var(--radius-btn)}
  .menu button:hover{background:var(--brand-soft);color:var(--brand-deep)}
  .hmore{position:relative}
  @media (max-width:640px){.stat .nm{font-size:34px}.stat{min-width:104px;padding:12px 16px}}

  /* ══════════ v7 · 航海志借鉴：行卡主视图 + 今日最小行动 + AI 深度分析 ══════════ */
  /* 行卡列表（主视图）：一行一个岗位，信息密度高 */
  .rows{padding:12px 20px;max-width:1080px;margin:0 auto}
  .rowcard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:13px 18px;margin-bottom:10px;cursor:pointer;transition:background .14s,border-color .14s}
  .rowcard:hover{background:var(--paper-2);border-color:var(--line-strong)}
  .rowcard .r-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .rowcard .r-top b{font-size:15px;letter-spacing:-.01em}
  .rowcard .r-role{font-size:13px;color:var(--ink-mid)}
  .rowcard .r-meta{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-mid);margin-top:6px;align-items:center}
  .rowcard .r-meta .st-pill{border-radius:var(--radius-pill);padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .rowcard .r-next{font-size:12px;color:var(--ink-light);margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
  .rowcard .r-side{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
  .rowcard .r-date{font-size:11px;color:var(--ink-light)}
  .rowcard .st-select{border-radius:var(--radius-pill);padding:4px 10px;font-weight:600}
  /* 今日最小行动：从数据推导的一条行动（非提示条，点击直达岗位） */
  .todaycard{display:flex;align-items:center;gap:12px;max-width:1080px;margin:10px 20px 0;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius-card);padding:11px 16px;cursor:pointer}
  .todaycard:hover{background:var(--paper-2)}
  .todaycard .tc-lb{font-size:11px;color:var(--brand);font-weight:700;white-space:nowrap}

<body>
<header>
  <div>
    <h1>Offer Tracker <span style="font-size:13px;font-weight:400;color:var(--ink-light)">秋招作战板</span></h1>
    <div class="sub">岗位池 · 投递追踪 · 漏斗复盘 —— 数据只存本机浏览器，换设备用「更多 › 导入」搬家</div>
  </div>
  <div class="hbtns">
    <button class="btn primary" onclick="UI.openForm()">＋ 添加岗位</button>
    <button class="btn" id="themeBtn" onclick="THEME.toggle(this)" title="切换深浅色">🌙</button>
    <div class="hmore">
      <button class="btn more" onclick="UI.toggleMenu()" title="更多">⋯</button>
      <div class="menu" id="moreMenu">
        <button onclick="UI.closeMenu();IO.exportJSON()">导出备份 (JSON)</button>
        <button onclick="UI.closeMenu();IO.exportCSV()">导出 CSV</button>
        <button onclick="UI.closeMenu();document.getElementById('importFile').click()">导入数据</button>
        <button onclick="UI.toggleDemoMenu(this)">演示数据</button>
        <button onclick="UI.closeMenu();UI.openAISettings()">AI 设置</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="IO.importJSON(this)">
  </div>
</header>

<div class="lvbar" id="levelBar"></div>
<div id="main"></div>

<!-- 添加/编辑 岗位 -->
<div class="mask" id="formMask">
  <div class="modal">
    <h2 id="formTitle">添加岗位</h2>
    <div class="form-grid" id="formBody"></div>
    <div class="mbtns">
      <button class="btn" onclick="UI.closeForm()">取消</button>
      <button class="btn primary" onclick="UI.saveForm()">保存</button>
    </div>
  </div>
</div>

<!-- 岗位详情 -->
<div class="mask" id="detailMask">
  <div class="modal" id="detailBody"></div>
</div>

<!-- 状态变更 · 日程时间窗（学航海志：改状态时可顺手记时间，自动进月历） -->
<div class="mask" id="evMask" onclick="if(event.target===this)UI.close('evMask')">
  <div class="modal" style="max-width:340px">
    <h2 id="ev-title" style="margin-bottom:14px">记录日程</h2>
    <label style="display:block;font-size:12px;color:var(--ink-mid);margin-bottom:4px">日期</label>
    <input id="ev-date" type="date">
    <label style="display:block;font-size:12px;color:var(--ink-mid);margin:10px 0 4px">时间（可选）</label>
    <input id="ev-time" type="time">
    <div class="ai-status" id="ev-st"></div>
    <div class="mbtns">
      <button class="btn" onclick="UI.close('evMask')">跳过</button>
      <button class="btn primary" onclick="UI.saveEvent()">确认</button>
    </div>
  </div>
</div>

<!-- 演示菜单 -->
<div class="mask" id="demoMask" onclick="if(event.target===this)UI.close('demoMask')">
  <div class="modal" style="max-width:360px">
    <h2>演示模式</h2>
    <p style="font-size:13px;color:var(--ink-mid);line-height:1.7;margin-bottom:14px">
      用脱敏假数据填满看板，供作品集展示。<br>
      ⚠️ 填充会覆盖当前数据，请先「导出备份」。
    </p>
    <div class="mbtns" style="justify-content:flex-start">
      <button class="btn" onclick="DEMO.load();UI.close('demoMask')">填充演示数据</button>
      <button class="btn danger" onclick="IO.clearAll()">清空全部数据</button>
    </div>
  </div>
</div>

<!-- AI 设置 -->
<div class="mask" id="aiMask" onclick="if(event.target===this)UI.close('aiMask')">
  <div class="modal" style="max-width:430px">
    <h2>AI 设置</h2>
    <p style="font-size:12px;color:var(--ink-mid);line-height:1.7;margin-bottom:12px">
      Key 只存在<b>你自己浏览器</b>的 localStorage 里，不进仓库、不经过任何服务器——谁用谁填自己的，费用自己可控。
      DeepSeek 官网 platform.deepseek.com 注册即有赠送额度；智谱 glm-4-flash 有免费档。</p>
    <label style="display:block;font-size:12px;color:var(--ink-mid);margin-bottom:4px">提供方</label>
    <select id="ai_provider"></select>
    <label style="display:block;font-size:12px;color:var(--ink-mid);margin:10px 0 4px">API Key</label>
    <input id="ai_key" type="password" placeholder="sk-… 或 智谱 key" autocomplete="off">
    <label style="display:block;font-size:12px;color:var(--ink-mid);margin:10px 0 4px">我的亮点（AI 的背景信息，用于打招呼语和答题思路）</label>
    <textarea id="ai_bio" rows="3" placeholder="如：软件工程本科，自研 AI 工作台迭代 13 周，产品直觉 + AI 协作 + 数据思维"></textarea>
    <div class="ai-status" id="ai-set-st"></div>
    <div class="mbtns">
      <button class="btn" onclick="UI.close('aiMask')">取消</button>
      <button class="btn primary" onclick="UI.saveAISettings()">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ═══════════ ① CONFIG 配置区（加状态/加字段只动这里） ═══════════ */
const CONFIG = {
  DATA_VERSION: 6,          // 数据结构版本：变更 +1 并在 STORE.migrate 写迁移
  LS_KEY: "job-tracker-v1",
  STALE_DAYS: 7,            // 已投后超过 N 天无状态变化 → 标「无进展」
  // 游戏化激励（学航海志，静默版：不弹窗不撒花，只在头部等级条上显示）
  GAME: {
    POINTS: { add:5, advance:10, review:10, offer:50 },   // 动作→积分
    LEVELS: [                                            // 累计积分→等级
      { at:0,   name:"新兵" }, { at:50,  name:"侦察兵" }, { at:150, name:"突击手" },
      { at:300, name:"主攻手" }, { at:500, name:"常胜将军" }, { at:800, name:"Offer收割机" },
    ],
  },
  // AI 提供方（OpenAI 兼容）。Key 只存访客自己浏览器（localStorage），绝不硬编码进仓库
  AI_PROVIDERS: {
    deepseek: { name:"DeepSeek（便宜，几分钱/次）", base:"https://api.deepseek.com", model:"deepseek-chat" },
    glm:      { name:"智谱 glm-4-flash（有免费额度）", base:"https://open.bigmodel.cn/api/paas/v4", model:"glm-4-flash" },
  },
  STAGES: [
    { id:"pool",      name:"待投递",   color:"#888780", icon:"📋" },
    { id:"applied",   name:"已投递",   color:"#378ADD", icon:"📮" },
    { id:"test",      name:"测评/笔试", color:"#BA7517", icon:"✍️" },
    { id:"interview", name:"面试中",   color:"#7F77DD", icon:"🎤" },
    { id:"offer",     name:"Offer",   color:"#639922", icon:"🏅" },
    { id:"rejected",  name:"挂了",     color:"#E24B4A", icon:"🕊️" },
  ],
  // 表单字段：type 支持 text/select/date/textarea；span=2 占满一行
  FIELDS: [
    { key:"company",  label:"公司名称 *", type:"text",   required:true },
    { key:"role",     label:"岗位名称 *", type:"text",   required:true },
    { key:"city",     label:"城市",       type:"text" },
    { key:"channel",  label:"投递渠道",   type:"text",   ph:"官网 / BOSS / 内推…" },
    { key:"deadline", label:"网申截止 DDL", type:"date" },
    { key:"resume",   label:"简历版本",   type:"text",   ph:"如：A公司AI产品版 v3" },
    { key:"salary",   label:"薪资范围",   type:"text",   ph:"可不填" },
    { key:"status",   label:"当前状态",   type:"select", options:"STAGES" },
    { key:"next",     label:"下一步动作", type:"text",   span:2, ph:"如：等测评邮件 / 周五前催HR" },
    { key:"jd",       label:"JD 原文（粘贴进来，AI 深度分析要用）", type:"textarea", span:2, rows:4, ph:"把招聘页的岗位描述整段粘贴到这里" },
    { key:"notes",    label:"备注（内推人 / 注意事项）", type:"textarea", span:2, rows:2 },
  ],
};
const stageOf = id => CONFIG.STAGES.find(s=>s.id===id) || CONFIG.STAGES[0];

/* 内置高频面试题库（闪卡用）：正面题目 / 背面回答方向。校招产品·AI产品方向通用 */
const QBANK_SEED = [
  { c:"开场",   q:"请做一个自我介绍（2 分钟版）", a:"三段式：①身份一句（学校+方向）②一个最能打的项目：背景→你做了什么→结果数字 ③为什么匹配这个岗位一句收尾。控制在 250 字，背熟但别像背书。" },
  { c:"项目",   q:"介绍你最有代表性的项目，深挖一个关键决策", a:"用 STAR，但重点放在「决策」：当时有哪几条路→你依据什么选了这条→被推翻过吗→后来怎么迭代。有推翻案例=有真实决策深度，比一帆风顺更可信。" },
  { c:"项目",   q:"这个项目里你遇到的最大困难是什么？", a:"选「真实的坎」不要选「 spun 困难」：说清现象→你当时怎么定位原因→试了什么→最终怎么解决→沉淀了什么方法论。结尾给一句「下次遇到同类问题我会…」。" },
  { c:"项目",   q:"如果重做一遍这个项目，你会改什么？", a:"诚实给 1-2 个真改进点（说明你有复盘能力），并解释为什么当时没这么做（约束条件）。忌说「我觉得已经很好了」。" },
  { c:"产品",   q:"你怎么理解产品经理这个角色？", a:"别背定义。说你的版本：PM 是「对结果负责的人」——上接业务目标、下接资源排期、中间用需求排序和验证把不确定性变成确定性。可举你项目里一次取舍。" },
  { c:"产品",   q:"给你一个新功能，怎么判断该不该做？", a:"给框架：①价值：解决谁的什么问题，频率×痛点强度 ②成本：开发/维护/风险 ③替代方案：不做会怎样 ④验证：最小成本试错方式（灰度/假门）。收尾强调「先小后大」。" },
  { c:"产品",   q:"需求优先级怎么排？", a:"报框架不背名词：价值（频率/痛点/战略权重）× 紧急（依赖/窗口期）÷ 成本，再加「依赖关系一票优先」。举例说明你真的排过。" },
  { c:"产品",   q:"数据下跌你怎么排查？", a:"先校准（是真是假：埋点/统计口径）→拆维度（渠道/版本/人群/时段）→定位突变点→归因（内部改动？外部事件？）→给动作。展示排查顺序感比结论重要。" },
  { c:"AI产品", q:"AI 产品的幻觉问题你怎么控制？", a:"分层答：数据层（来源可信度分级）→生成层（prompt 约束+few-shot）→产品层（关键信息标注来源、可回溯）→兜底（敏感场景 human-in-the-loop）。有实践案例就带一句。" },
  { c:"AI产品", q:"AI 产品和传统产品的核心区别是什么？", a:"三个不确定：输出不确定（要做质检与兜底）、成本不确定（token 监控+降级链）、用户预期不确定（管理期望，别承诺 100% 对）。你的工作台里就有实例可讲。" },
  { c:"AI产品", q:"你怎么看大模型会淘汰哪些产品经理？", a:"不接「淘汰」的焦虑陷阱。答：淘汰的是只会画原型写文档的；留下的是能定义问题、评估模型输出质量、设计人机协作流程的。顺手带出你用 AI 干活的效率证据。" },
  { c:"AI产品", q:"如果让你给 XX 产品加一个 AI 功能，你加什么？", a:"先反问场景再答（面试官常给模糊题考你澄清习惯）：这个产品用户最高频的痛点是什么→AI 是否是比传统方案好 10 倍的解法→成本可控吗。忌上来就「加个 AI 客服」。" },
  { c:"行为",   q:"你的缺点是什么？", a:"选「真实但可管理」的：如「容易在细节上过度打磨，现在用时间盒控制」。结构：缺点→意识到的影响→正在用的改进机制。忌「我太追求完美」这种伪缺点。" },
  { c:"行为",   q:"说一次你和别人意见不一致的经历", a:"选工作/项目场景：对方立场→你的依据（数据/用户视角）→怎么沟通的→结果如何。重点展示「对事不对人+用证据说话」，别选成输赢故事。" },
  { c:"行为",   q:"你为什么想来我们公司/这个岗位？", a:"三层：①我对这个业务的具体兴趣（说细节证明做过功课）②我的能力与岗位 JD 的具体匹配点 ③这个阶段我能贡献什么+想学什么。忌泛泛「平台大/行业好」。" },
  { c:"行为",   q:"你还有其他 offer 吗？", a:"诚实但不施压：有就说在流程中（体现竞争力），说明你最看重这家什么（成长性/业务方向），表达优先级。没有就说「目前贵司是第一优先，在集中准备」。" },
  { c:"情景",   q:"开发说需求做不完，要砍功能，你怎么办？", a:"不吵架不全部让步：①一起评估：哪部分是核心价值不可砍、哪部分可以降级（分期/降配）②给优先级依据 ③对齐目标后向上同步风险。展示「用优先级解决冲突」。" },
  { c:"情景",   q:"上线前发现一个非致命 bug，发还是不发？", a:"给决策框架不拍脑袋：影响面（多少用户/资损/体验）×修复成本×上线性质。默认：影响核心体验或数据就延，边缘问题先上+热修。展示风险量化思维。" },
  { c:"情景",   q:"老板的需求你不认同，怎么办？", a:"先执行理解：问清背景和目标（也许你有信息差）→带着数据和替代方案沟通一次→若仍坚持，执行中保留验证数据。展示「先对齐再执行」而非硬顶。" },

/* ═══════════ ② STORE 数据层（唯一入口，别绕过它改数据） ═══════════ */
const STORE = {
  data: { version: CONFIG.DATA_VERSION, jobs: [] },
  load(){
    try{ const raw = localStorage.getItem(CONFIG.LS_KEY);
      if(raw) this.data = this.migrate(JSON.parse(raw));
    }catch(e){ console.error("读取失败", e); }
    return this.data;
  },
  save(){ localStorage.setItem(CONFIG.LS_KEY, JSON.stringify(this.data)); },
  migrate(d){
    if(!d.version) d.version = 1;
    if(!Array.isArray(d.jobs)) d.jobs = [];
    if(d.version < 2) d.version = 2;            // v2：岗位新增 reviews（面试复盘），旧数据补空数组即可
    if(d.version < 3) d.version = 3;            // v3：复盘新增 advice（AI 思路）、岗位新增 greeting（AI 打招呼语）
    if(d.version < 4) d.version = 4;            // v4：游戏化积分 + 岗位日程
    if(d.version < 5) d.version = 5;            // v5：岗位新增 jd（JD 原文）+ analysis（AI 深度分析结果）
    if(d.version < 6) d.version = 6;            // v6：岗位新增 checks（备考/准备清单）
    if(!d.meta || typeof d.meta!=="object") d.meta = {};   // 无条件保证存在（演示数据/导入数据都可能带 v4 版本号但缺 meta）
    if(typeof d.meta.points !== "number") d.meta.points = 0;
    d.jobs.forEach(j=>{
      if(!Array.isArray(j.reviews)) j.reviews = [];
      j.reviews.forEach(r=>{ if(!r.advice || typeof r.advice!=="object") r.advice = {}; });
      if(typeof j.greeting !== "string") j.greeting = "";
      if(!Array.isArray(j.events)) j.events = [];   // 面试/测评日程节点：{date,time,label}
      if(typeof j.jd !== "string") j.jd = "";       // v5：JD 原文（AI 深度分析输入）
      if(!j.analysis || typeof j.analysis!=="object") j.analysis = { prep:"", match:"" };  // v5：AI 深度分析结果
      if(typeof j.analysis.prep !== "string") j.analysis.prep = "";
      if(typeof j.analysis.match !== "string") j.analysis.match = "";
      if(!Array.isArray(j.checks)) j.checks = [];   // v6：备考/准备清单 [{t,done}]
    });
    return d;
  },
  /* ── 游戏化积分（静默）：只在头部等级条显示，不弹窗打扰 ── */
  points(n){ if(!this.data.meta) this.data.meta = { points:0 }; this.data.meta.points = Math.max(0,(this.data.meta.points||0)+n); this.save(); },
  level(){
    const p = (this.data.meta && this.data.meta.points) || 0;
    const L = CONFIG.GAME.LEVELS;
    let cur = L[0], next = null;
    L.forEach((l,i)=>{ if(p >= l.at){ cur = l; next = L[i+1] || null; } });
    const base = cur.at, ceil = next ? next.at : cur.at;
    return { lv: L.indexOf(cur)+1, name: cur.name, p, next, pct: next ? Math.min(100, Math.round((p-base)/(ceil-base)*100)) : 100 };
  },
  add(job){
    job.id = Date.now() + "" + Math.floor(Math.random()*1e4);
    job.history = [{ status: job.status || "pool", at: new Date().toISOString() }];
    job.createdAt = job.updatedAt = new Date().toISOString();
    if(!Array.isArray(job.events)) job.events = [];
    this.data.jobs.unshift(job); this.save();
    this.points(CONFIG.GAME.POINTS.add);
  },
  update(id, patch, moveStatus){
    const j = this.data.jobs.find(x=>x.id===id); if(!j) return;
    const changed = moveStatus && moveStatus !== j.status; // 必须在合并前比较，否则旧状态被覆盖、历史永远不记
    Object.assign(j, patch);
    if(changed){
      j.status = moveStatus;
      j.history.push({ status: moveStatus, at: new Date().toISOString() });
      // 状态推进给积分：前进 +10，到 Offer +50（回退不给不扣）
      const order = CONFIG.STAGES.findIndex(s=>s.id===j.status);
      const oldOrder = CONFIG.STAGES.findIndex(s=>s.id===(j.history.length>=2 ? j.history[j.history.length-2].status : j.status));
      if(order > oldOrder) this.points(order >= CONFIG.STAGES.findIndex(s=>s.id==="offer") ? CONFIG.GAME.POINTS.offer : CONFIG.GAME.POINTS.advance);
    }
    j.updatedAt = new Date().toISOString();
    this.save();
  },
  remove(id){ this.data.jobs = this.data.jobs.filter(x=>x.id!==id); this.save(); },
  addReview(id, r){
    const j = this.data.jobs.find(x=>x.id===id); if(!j) return;
    if(!Array.isArray(j.reviews)) j.reviews = [];
    r.at = new Date().toISOString();
    j.reviews.unshift(r); this.save();
    this.points(CONFIG.GAME.POINTS.review);
  },
  /* ── 日程节点（学航海志：状态变更 → 可选填时间 → 自动进月历） ── */
  addEvent(id, ev){
    const j = this.data.jobs.find(x=>x.id===id); if(!j) return;
    if(!Array.isArray(j.events)) j.events = [];
    j.events.push(ev); this.save();
  },
  removeReview(id, idx){
    const j = this.data.jobs.find(x=>x.id===id); if(!j || !j.reviews) return;
    j.reviews.splice(idx, 1); this.save();
  },
  addAdvice(id, rIdx, qText, text){
    // AI 生成的答题思路，按题目原文挂到对应复盘下（题目是 key，重生成直接覆盖）
    const j = this.data.jobs.find(x=>x.id===id); if(!j || !j.reviews || !j.reviews[rIdx]) return;
    if(!j.reviews[rIdx].advice || typeof j.reviews[rIdx].advice!=="object") j.reviews[rIdx].advice = {};
    j.reviews[rIdx].advice[qText] = text;
    j.updatedAt = new Date().toISOString();
    this.save();
  },
  replaceAll(d){ this.data = this.migrate(d); this.save(); },
  setAnalysis(id, key, text){
    const j = this.data.jobs.find(x=>x.id===id); if(!j) return;
    if(!j.analysis || typeof j.analysis!=="object") j.analysis = { prep:"", match:"" };
    j.analysis[key] = text;
    j.updatedAt = new Date().toISOString();
    this.save();
  },
  addCheck(id, text){
    const j = this.data.jobs.find(x=>x.id===id); if(!j || !text) return;
    if(!Array.isArray(j.checks)) j.checks = [];
    j.checks.push({ t: text, done: false }); this.save();
  },
  toggleCheck(id, idx){
    const j = this.data.jobs.find(x=>x.id===id); if(!j || !j.checks || !j.checks[idx]) return;
    j.checks[idx].done = !j.checks[idx].done; this.save();
  },
  removeCheck(id, idx){
    const j = this.data.jobs.find(x=>x.id===id); if(!j || !j.checks) return;
    j.checks.splice(idx, 1); this.save();
  },
};

/* ═══════════ ③ 工具函数 ═══════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = () => { const t=new Date(); t.setHours(0,0,0,0); return t; };
function daysUntil(dateStr){ if(!dateStr) return null; return Math.round((new Date(dateStr+"T00:00:00") - today())/864e5); }
function daysSince(iso){ return Math.floor((today() - new Date(iso))/864e5); }
function fmtDate(iso){ return iso ? iso.slice(0,10) : "—"; }
function ddlTag(d){
  const n = daysUntil(d);
  if(n===null) return "";
  if(n<0)   return `<span class="tag ddl-soon">DDL已过 ${-n}天</span>`;
  if(n<=3)  return `<span class="tag ddl-soon">⏳还剩${n}天</span>`;
  if(n<=7)  return `<span class="tag ddl-week">还剩${n}天</span>`;
  return `<span class="tag">DDL ${d.slice(5)}</span>`;
}
function staleTag(j){
  // 已投/测评/面试中 且 状态更新超过 N 天 → 提示可催
  if(["pool","offer","rejected"].includes(j.status)) return "";
  const d = daysSince(j.updatedAt);
  return d >= CONFIG.STALE_DAYS ? `<span class="tag stale">已${d}天无进展</span>` : "";
}
function isoDay(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// 月历事件聚合（纯函数）：DDL 红 / 投递 蓝 / 面试复盘 粉
const CAL = {
  TYPES: { ddl:{label:"DDL", color:"#E24B4A"}, applied:{label:"投递", color:"#378ADD"}, review:{label:"复盘", color:"#BA7517"}, event:{label:"日程", color:"#7F77DD"} },
  eventsByDate(jobs){
    const map = {};
    const put = (date,type,jobId,extra,time)=>{ if(!date) return;
      (map[date] = map[date]||[]).push({ type, jobId, time, ...extra }); };
    jobs.forEach(j=>{
      if(j.deadline && daysUntil(j.deadline) >= 0) put(j.deadline, "ddl", j.id, { text:j.company+" DDL" });
      if(j.appliedAt) put(String(j.appliedAt).slice(0,10), "applied", j.id, { text:"投递 "+j.company });
      (j.reviews||[]).forEach(r=> put(r.date || (r.at?String(r.at).slice(0,10):""), "review", j.id,
        { text:(j.company)+" "+(r.round||"复盘") }));
      (j.events||[]).forEach(e=> put(e.date, "event", j.id, { text:(e.label||"日程")+" "+j.company }, e.time||""));
    });
    return map;
  },
};

    const js = STORE.data.jobs;
    const entered = id => js.filter(x=>(x.history||[]).some(h=>h.status===id)).length;
    const steps = ["applied","test","interview","offer"].map(id=>({ name:stageOf(id).name, n:entered(id), color:stageOf(id).color }));
    const max = Math.max(steps[0].n, 1);
    let weak = null;
    let html = `<div class="fsteps">`;
    steps.forEach((s,i)=>{
      html += `<div class="fstep"><div class="fbar2" style="width:${Math.max(8, s.n/max*66)}%;background:${s.color}">${s.n}</div><span class="flb">${s.name}</span></div>`;
      if(i<steps.length-1){
        const r = s.n ? steps[i+1].n/s.n : null;
        if(r!==null){
          html += `<div class="frate2">└ 转化 ${Math.round(r*100)}%</div>`;
          if(s.n>0 && (weak===null || r<weak.r)) weak = { from:s.name, to:steps[i+1].name, r };

      if(f.stage==="__stale" && staleTag(j)==="") return false;
      if(f.stage==="__ddl"){ const d=daysUntil(j.deadline); if(j.status==="rejected"||d===null||d<0||d>7) return false; }
      if(f.q && !(j.company+j.role+(j.notes||"")).toLowerCase().includes(f.q.toLowerCase())) return false;
      return true;
    });
    return STORE.data.jobs.filter(j=>{
      if(f.stage!=="all" && j.status!==f.stage) return false;
      if(f.q && !(j.company+j.role+(j.notes||"")).toLowerCase().includes(f.q.toLowerCase())) return false;
      return true;
    });
  },

  funnel(){
    // v6：转化率已并入大数字区下的今日焦点行，此处保留空实现以兼容旧调用
    return "";
  },

  todayCard(){
    // 今日最小行动（学航海志「今日航海建议」）：从投递状态推导一条，点击直达岗位
    const js = STORE.data.jobs;
    let pick = null, act = "";
    let upEv = null, upJob = null;
    js.forEach(j=>(j.events||[]).forEach(e=>{
      if(!e.date) return;
      const d = new Date(e.date+"T23:59:59");
      if(d >= today() && (!upEv || e.date < upEv.date)){ upEv = e; upJob = j; }
    }));
    if(upJob){
      const n = daysUntil(upEv.date);
      pick = upJob;
      act = n <= 0 ? `今天就是「${upJob.company}」${upEv.label||"日程"} —— 过一遍题库和自我介绍`
                   : `「${upJob.company}」${upEv.label||"日程"} 还剩 ${n} 天 —— ${n<=2?"今晚":"这两天"}准备 JD 关键词和预测问题`;
    }else{
      const ddl = js.filter(j=>{ const d=daysUntil(j.deadline); return j.status==="pool" && d!==null && d<=3; })
                    .sort((a,b)=>daysUntil(a.deadline)-daysUntil(b.deadline))[0];
      if(ddl){ pick = ddl; act = `「${ddl.company}」DDL 还剩 ${daysUntil(ddl.deadline)} 天 —— 今天投出去`; }
      else{
        const stale = js.find(j=>staleTag(j)!=="");
        if(stale){ pick = stale; act = `「${stale.company}」已超 ${CONFIG.STALE_DAYS} 天无进展 —— 今天催一下，或放下转投`; }
        else{
          const pool = js.find(j=>j.status==="pool");
          if(pool){ pick = pool; act = `从待投递里挑一家（比如「${pool.company}」），今天投出去`; }
        }
      }
    }
    if(!pick) return "";
    return `<div class="todaycard" onclick="UI.openDetail('${pick.id}')">
      <span class="tc-lb">今日最小行动</span>
      <span class="tc-tx">${esc(act)}</span>
      <span class="tc-go">去准备 →</span>
    </div>`;
  },

  stats(){
    const js = STORE.data.jobs;
    const n = id => js.filter(j=>j.status===id).length;
    const applied = js.filter(j=>j.status!=="pool").length;
    const iv = n("interview"), of = n("offer");
    const stale = js.filter(j=>staleTag(j)!=="").length;
    const ddlSoon = js.filter(j=>{ const d=daysUntil(j.deadline); return j.status!=="rejected" && d!==null && d>=0 && d<=7; }).length;
    const cell = (lb,nm,sub,hl) => `<div class="stat${hl?" hl":""}"><div class="lb">${lb}</div><div class="nm">${nm}</div><div class="sub2">${sub}</div></div>`;
    const fb = (lb,nm,filter) => filter ? `<button class="fbtn" onclick="VIEWS.filter.stage=VIEWS.filter.stage==='${filter}'?'all':'${filter}';renderMain()">${lb} <b>${nm}</b></button>` : "";
    return `<div class="stats">
      ${cell("已投递",applied,`共 ${js.length} 个岗位`,false)}
      ${cell("面试中",iv,iv?"正在推进":"暂无",iv>0)}
      ${cell("Offer",of,of?"有回音了":"继续投",of>0)}
    </div>
    <div class="focusline">
      ${fb("待投递",n("pool"),"__pool")}${fb("DDL 7 天内",ddlSoon,"__ddl")}${fb("需跟进",stale,"__stale")}
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--ink-light)">转化：投→面 ${(()=>{const a=applied;return a?Math.round(iv/a*100)+"%":"—"})()} · 面→offer ${iv?Math.round(of/iv*100)+"%":"—"}</span>
    </div>`;
  },

  levelBar(){
    const l = STORE.level();
    const nextTxt = l.next ? `再 ${l.next.at - l.p} 分升 ${l.next.name}` : "已满级";
    return `<div class="lvbar">
      <span class="lv">Lv.${l.lv}</span><span class="lvname">${l.name}</span>
      <div class="track"><div class="fill" style="width:${l.pct}%"></div></div>
      <span style="color:var(--ink-light)">${nextTxt}</span>
      <span class="en">⚡ ${l.p}</span>
    </div>`;
  },

  board(){
    const vis = this.visibleJobs();
    const cols = CONFIG.STAGES.map(s=>{
      const cards = vis.filter(j=>j.status===s.id).map(j=>this.card(j)).join("");
      return `<div class="col" style="--stc:${s.color};--stc-soft:${s.color}1A" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="event.preventDefault();this.classList.remove('drag-over');UI.dropCard(event,'${s.id}')">
        <h3><span class="dot" style="background:${s.color}"></span>${s.icon||""} ${s.name}
          <span class="cnt">${vis.filter(j=>j.status===s.id).length}</span></h3>
        ${cards || ""}
        <button class="add" onclick="UI.openForm(null,'${s.id}')">＋ 加到「${s.name}」</button>
      </div>`;
    }).join("");
    return `<div class="board">${cols}</div>`;
  },

  card(j){
    const st = stageOf(j.status);
    const stale = staleTag(j);
    const follow = stale !== "";
    const tt = follow ? ` title="超 ${CONFIG.STALE_DAYS} 天无进展，点开可推进状态"` : "";
    const ev = (j.events&&j.events[j.events.length-1]) || null;
    return `<div class="card${follow?" has-follow":""}" style="--st:${st.color}"${tt} draggable="true" ondragstart="UI.dragCard(event,'${j.id}')" onclick="UI.openDetail('${j.id}')">
      <div class="co">${esc(j.company)}</div>
      <div class="role">${esc(j.role)}${j.city? " · 📍"+esc(j.city):""}</div>
      <div class="meta">
        <span class="tag"><span class="st-dot" style="background:${st.color}"></span>${st.name}</span>
        ${ddlTag(j.deadline)}${stale}${ev?`<span class="tag ev">📅 ${esc(ev.label)} ${esc(ev.date.slice(5))}${ev.time?" "+esc(ev.time):""}</span>`:""}${j.resume?`<span class="tag">简历·${esc(j.resume)}</span>`:""}
      </div>
      ${j.next? `<div class="next">→ ${esc(j.next)}</div>`:""}
    </div>`;
  },

  table(){
    // v7 主视图：行卡列表（学航海志）——一行一岗，右侧状态下拉直改（改状态顺手弹日程窗）
    const vis = this.visibleJobs();
    if(!vis.length) return `<div class="empty">没有匹配的岗位</div>`;
    const rows = vis.map(j=>{
      const st = stageOf(j.status);
      const ev = (j.events&&j.events[j.events.length-1]) || null;
      const evSoon = ev && (()=>{ const d=daysUntil(ev.date); return d!==null && d>=0 && d<=2; })();
      return `<div class="rowcard" onclick="UI.openDetail('${j.id}')">
        <div class="r-main" style="flex:1;min-width:0">
          <div class="r-top"><b>${esc(j.company)}</b><span class="r-role">${esc(j.role)}</span></div>
          <div class="r-meta">
            <span class="st-pill" style="background:${st.color}1A;color:${st.color}">${st.icon||""} ${st.name}</span>
            ${j.city?`<span>📍 ${esc(j.city)}</span>`:""}
            ${j.channel?`<span>💬 ${esc(j.channel)}</span>`:""}
            ${j.salary&&j.salary!=="—"?`<span>💰 ${esc(j.salary)}</span>`:""}
            ${j.resume?`<span>📄 ${esc(j.resume)}</span>`:""}
            ${j.deadline?`<span>${ddlTag(j.deadline)}</span>`:""}
            ${staleTag(j)}
            ${ev?`<span class="${evSoon?"ev-soon":""}">📅 ${esc(ev.label)} ${esc(ev.date.slice(5))}${ev.time?" "+esc(ev.time):""}${evSoon?" · 快到了":""}</span>`:""}
          </div>
          ${j.next?`<div class="r-next">→ ${esc(j.next)}</div>`:""}
        </div>
        <div class="r-side">
          <select class="st-select" style="border-color:${st.color};color:${st.color}" onclick="event.stopPropagation()"
            onchange="UI.moveStatus('${j.id}',this.value);renderMain()">
            ${CONFIG.STAGES.map(s=>`<option value="${s.id}" ${j.status===s.id?"selected":""}>${s.icon||""} ${s.name}</option>`).join("")}
          </select>
          <span class="r-date">${j.appliedAt? esc(fmtDate(j.appliedAt)) : "未投"}</span>
        </div>
      </div>`;
    }).join("");
    return `<div class="rows">${rows}</div>`;
  },

  resumeView(){
    // 简历版本管理（轻）：按「简历版本」聚合——每个版本投到哪、走到多远，看出哪个版本好回
    const js = STORE.data.jobs.filter(j=>j.resume && j.resume.trim());
    if(!js.length) return `<div class="empty" style="margin-top:40px">
      <b>还没有岗位填过简历版本</b>
      <div style="font-size:12px;color:var(--ink-light);margin-top:6px">编辑岗位时填「简历版本」，这里就能对比每个版本走到多远</div></div>`;
    const groups = {};
    js.forEach(j=>{ const k=j.resume.trim(); (groups[k] = groups[k]||[]).push(j); });
    const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
    const cards = keys.map(k=>{
      const arr = groups[k];
      const n = id => arr.filter(j=>j.status===id).length;
      const live = n("applied")+n("test")+n("interview")+n("offer");
      const cos = arr.map(j=>`<button class="rv-co" onclick="UI.openDetail('${j.id}')">${esc(j.company)}<i style="color:${stageOf(j.status).color}">${stageOf(j.status).name}</i></button>`).join("");
      return `<div class="rvcard">
        <div class="rv-top"><b>📄 ${esc(k)}</b>
          <span class="rv-cnt">投出 ${arr.filter(j=>j.status!=="pool").length} · 有效进行中 ${live}</span></div>
        <div class="rv-nums">
          <span><b>${n("applied")}</b> 已投</span><span><b>${n("test")}</b> 测评</span>
          <span><b>${n("interview")}</b> 面试</span><span><b>${n("offer")}</b> Offer</span>
          <span><b>${n("rejected")}</b> 挂</span>
        </div>
        <div class="rv-cos">${cos}</div>
      </div>`;
    }).join("");
    return `<div class="rvcards">${cards}</div>`;
  },

  qbank(){
    // 题库：聚合所有岗位复盘里被问过的题，面试前按公司过一遍
    const items = [];
    STORE.data.jobs.forEach(j=>(j.reviews||[]).forEach((r,ri)=>
      (r.questions||[]).forEach((q,qi)=>items.push({q, co:j.company, round:r.round||"", date:r.date||fmtDate(r.at), jobId:j.id, ri, qi, advice:(r.advice||{})[q]||""}))));
    this._qitems = items;
    items.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    if(!items.length) return `<div class="empty" style="margin-top:40px">
      <b>题库还是空的</b>
      <div style="font-size:12px;color:var(--ink-light);margin-top:6px">面试完在岗位详情里「＋ 添加复盘」，被问倒的题会汇到这里</div></div>`;
    return `<div style="font-size:12px;color:var(--ink-light);margin-bottom:10px">共 ${items.length} 道被问过的题 · 下次面试前按公司过一遍 · 点「思路」让 AI 给答题要点</div>` +
      items.map((it,i)=>`<div class="qitem"><div>${esc(it.q)}</div>
        ${it.advice? `<div class="ai-box" id="qb-adv-${i}">${esc(it.advice)}</div>`:""}
        <div class="ai-status" id="qb-st-${i}"></div>
        <div class="qmeta">${esc(it.co)} · ${esc(it.round)} · ${esc(it.date)}
          <button class="btn small" style="margin-left:8px;padding:2px 8px"
            onclick="AI.adviceQB(${i})">AI 思路</button>
        </div></div>`).join("");
  },

  calendar(){
    // 本土化月历：有事件才标记，点日期在下方内联展开，不做大日历主视图
    const now = new Date();
    const ym = this.calMonth || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
    const [y,m] = ym.split("-").map(Number);
    const startDow = (new Date(y, m-1, 1).getDay()+6)%7;   // 周一=0
    const dim = new Date(y, m, 0).getDate();
    const ev = CAL.eventsByDate(STORE.data.jobs);
    const todayStr = isoDay(today());
    if(this.calSel && !ev[this.calSel] && this.calSel!==todayStr) {} // 选中日无事件也展示空态
    const sel = this.calSel;
    const nav = (d)=>{
      const nd = new Date(y, m-1+d, 1);
      return `VIEWS.calMonth='${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,"0")}';VIEWS.calSel=null;renderResults()`;
    };
    let cells = "";
    for(let i=0;i<startDow;i++) cells += `<div class="cal-cell blank"></div>`;
    for(let d=1;d<=dim;d++){
      const ds = `${ym}-${String(d).padStart(2,"0")}`;
      const es = ev[ds]||[];
      const minis = es.slice(0,2).map(e=>`<span class="cal-ev-mini" style="background:${CAL.TYPES[e.type].color}18;color:${CAL.TYPES[e.type].color}" onclick="event.stopPropagation();UI.openDetail('${e.jobId}')">${e.time? esc(e.time)+" ":""}${esc(e.text)}</span>`).join("");
      const more = es.length>2 ? `<span class="cal-ev-mini" style="color:var(--ink-light)">+${es.length-2}</span>` : "";
      cells += `<button class="cal-cell ${ds===todayStr?"today":""} ${ds===sel?"sel":""}"
        onclick="VIEWS.calSel=VIEWS.calSel==='${ds}'?null:'${ds}';renderResults()">${d}${minis}${more}</button>`;
    }
    let panel = "";
    if(sel){
      const es = ev[sel]||[];
      panel = `<div class="cal-panel"><b style="font-size:13px">${sel.slice(5)} ${es.length?"· "+es.length+" 件事":"· 没有安排"}</b>
        ${es.map(e=>`<div class="cal-ev" onclick="UI.openDetail('${e.jobId}')">
          <span class="cdot" style="background:${CAL.TYPES[e.type].color}"></span>
          ${CAL.TYPES[e.type].label} · ${esc(e.text)}<span class="ct">点击看详情 →</span></div>`).join("")}</div>`;
    }
    return `<div class="calwrap">
      <div class="cal-head">
        <button class="cal-nav" onclick="${nav(-1)}">‹</button><b>${y} 年 ${m} 月</b><button class="cal-nav" onclick="${nav(1)}">›</button>
        <span style="margin-left:auto;font-size:11px;color:var(--ink-light);display:flex;gap:8px">
          ${Object.values(CAL.TYPES).map(t=>`<span><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${t.color};margin-right:3px"></i>${t.label}</span>`).join("")}
        </span>
      </div>
      <div class="cal-grid">${["一","二","三","四","五","六","日"].map(w=>`<div class="cal-wd">${w}</div>`).join("")}${cells}</div>
      ${panel}</div>`;
  },

  news(){
    const items = (NEWS.items||[]).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    return `<div style="font-size:12px;color:var(--ink-light);margin-bottom:10px">共 ${items.length} 条情报 · 由 AI 活动雷达定期更新</div>` +
      items.map(n=>`<div class="qitem">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${n.url? `<a href="${esc(n.url)}" target="_blank" rel="noopener" style="color:var(--pink-deep);text-decoration:none"><b>${esc(n.title)}</b></a>` : `<b>${esc(n.title)}</b>`}
          <span class="tag" style="margin-left:auto">${esc(n.tag||"情报")}</span>
        </div>
        ${n.note? `<div class="qmeta" style="margin-top:6px">${esc(n.note)}</div>`:""}
        <div class="qmeta">${esc(n.date||"")}${n.deadline? " · 截止 "+esc(n.deadline):""}</div>
      </div>`).join("");
  },
};

function renderMain(){
  const f = VIEWS.filter;
  $("#levelBar").innerHTML = VIEWS.levelBar();   // 等级条常驻（含空态）
  // 空态引导：首次打开不显示空白看板，给三条开始路径（零摩擦）
  if(!STORE.data.jobs.length){
    $("#main").innerHTML = `<div class="empty" style="margin-top:80px">
      <b style="font-size:16px">看板是空的</b>
      <div style="margin:16px auto 8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn primary" onclick="UI.openForm()">＋ 添加岗位</button>
        <button class="btn" onclick="DEMO.load()">载入演示数据</button>
        <button class="btn" onclick="VIEWS.module='prep';renderMain()">先去面试备战逛逛</button>
      </div>
      <div style="font-size:12px;color:var(--ink-light);margin-top:8px">有备份 JSON？右上角 ⋯ › 导入</div>
    </div>`;
    return;
  }
  // v9 顶层模块导航（学航海志：投递管理 / 面试备战 / 画像）
  const nav = `<div class="mainnav">
    <button class="${VIEWS.module==="jobs"?"on":""}" onclick="VIEWS.module='jobs';renderMain()">📮 投递管理</button>
    <button class="${VIEWS.module==="prep"?"on":""}" onclick="VIEWS.module='prep';renderMain()">🎯 面试备战</button>
    <button class="${VIEWS.module==="me"?"on":""}" onclick="VIEWS.module='me';renderMain()">👤 我的画像</button>
  </div>`;
  if(VIEWS.module==="prep"){
    $("#main").innerHTML = nav + `<div class="prepwrap">${VIEWS.prepModule()}</div>`;
    return;
  }
  if(VIEWS.module==="me"){
    $("#main").innerHTML = nav + `<div class="mewrap">${VIEWS.mePage()}</div>`;
    return;
  }
  const chips = [`<button class="chip ${f.stage==='all'?'on':''}" onclick="VIEWS.filter.stage='all';renderMain()">🎯 全部</button>`]
    .concat(CONFIG.STAGES.map(s=>
      `<button class="chip ${f.stage===s.id?'on':''}" onclick="VIEWS.filter.stage='${s.id}';renderMain()">${s.icon} ${s.name}</button>`))
    .join("");
  $("#main").innerHTML =
    nav +
    VIEWS.stats() +
    VIEWS.todayCard() +
    `<div class="toolbar">
      <input type="search" placeholder="搜公司 / 岗位 / 备注…" value="${esc(f.q)}"
        oninput="VIEWS.filter.q=this.value;renderResults()" style="caret-color:var(--brand)">
      ${chips}
      <span style="margin-left:auto"></span>
      <button class="btn small vbtn" data-v="table" onclick="VIEWS.filter.view='table';renderResults()">列表</button>
      <button class="btn small vbtn" data-v="board" onclick="VIEWS.filter.view='board';renderResults()">看板</button>
      <button class="btn small vbtn" data-v="cal" onclick="VIEWS.filter.view='cal';renderResults()">月历</button>
      <button class="btn small vbtn" data-v="resume" onclick="VIEWS.filter.view='resume';renderResults()">简历</button>
      <button class="btn small vbtn" data-v="qbank" onclick="VIEWS.filter.view='qbank';renderResults()">题库</button>
      <button class="btn small vbtn" data-v="news" id="newsBtn" style="display:none" onclick="VIEWS.filter.view='news';renderResults()">情报</button>
    </div>
    <div id="resultsArea"></div>`;
  NEWS.applyBtn();
  renderResults();
}
// 搜索时只重绘结果区，不动工具条 → 输入框光标/焦点不丢（踩坑库：全量重绘导致焦点/滚动丢失）
// v7：默认视图=行卡列表（航海志式），看板降为切换视图
function renderResults(){
  const area = $("#resultsArea"); if(!area) return;
  const v = VIEWS.filter.view || "table";
  area.innerHTML = v==="table" ? VIEWS.table()
                 : v==="qbank" ? VIEWS.qbank()
                 : v==="cal" ? VIEWS.calendar()
                 : v==="news" ? VIEWS.news()
                 : v==="resume" ? VIEWS.resumeView()
                 : v==="board" ? VIEWS.board()
                 : VIEWS.table();
  if(document.querySelectorAll) document.querySelectorAll(".vbtn").forEach(b=>{
    b.classList.toggle("on", b.dataset.v === v);
    b.style.borderColor = b.classList.contains("on") ? "var(--brand)" : "";
    b.style.color = b.classList.contains("on") ? "var(--brand)" : "";
  });
}
/* 「需跟进 / 待投递 / DDL」过滤已统一并入 visibleJobs */

/* ═══════════ ⑤ UI 交互（表单 / 详情） ═══════════ */
const UI = {
  editingId: null,

  open(mask){ $("#"+mask).classList.add("show"); },
  close(mask){ $("#"+mask).classList.remove("show"); },

  openForm(id=null, presetStage="pool"){
    this.editingId = id;
    const j = id ? STORE.data.jobs.find(x=>x.id===id) : { status: presetStage };
    $("#formTitle").textContent = id ? "编辑岗位" : "添加岗位";
    $("#formBody").innerHTML = CONFIG.FIELDS.map(f=>{
      const v = j[f.key] ?? "";
      const span = f.span? " full":"";
      if(f.type==="select"){
        const opts = CONFIG.STAGES.map(s=>`<option value="${s.id}" ${v===s.id?"selected":""}>${s.name}</option>`).join("");

  /* ── AI 深度分析结果渲染 ── */
  renderPrep(text){
    if(!text) return "";
    const parts = text.split(/(?=【[^】]{1,20}】)/).map(s=>s.trim()).filter(Boolean);
    return `<div class="ana-box">${parts.map(p=>{
      const m = p.match(/^【([^】]+)】\s*([\s\S]*)$/);
      return m ? `<div class="ana-sec"><div class="ana-h">${esc(m[1])}</div><div class="ana-b">${esc(m[2]).trim()}</div></div>`
               : `<div class="ana-b">${esc(p)}</div>`;
    }).join("")}</div>`;
  },
  renderMatch(text){
    if(!text) return "";
    const lines = text.split(/\n/).map(l=>l.trim()).filter(l=>l.includes("|"));
    if(lines.length < 2) return `<div class="ana-box"><div class="ana-b">${esc(text)}</div></div>`;
    const cells = l => l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
    const head = cells(lines[0]);
    const body = lines.slice(1).filter(l=>!/^[\s|:\-]+$/.test(l)).map(cells);
    return `<div class="ana-box" style="overflow-x:auto"><table class="matchtable">
      <thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${body.map(r=>`<tr>${head.map((_,i)=>`<td>${esc(r[i]||"")}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  },

/* ═══════════ ⑤.5 AI 能力（DeepSeek / 智谱，OpenAI 兼容直连） ═══════════ */
const AI = {
  cfg: null,
  load(){ try{ this.cfg = JSON.parse(localStorage.getItem("ot-ai")||"null"); }catch(e){ this.cfg = null; } this.indicate(); },
  ready(){ return !!(this.cfg && this.cfg.key && this.cfg.provider); },
  indicate(){
    const b = document.getElementById("aiBtn"); if(!b) return;
    b.textContent = this.ready() ? "AI ✓" : "AI 设置";
    b.style.borderColor = this.ready() ? "var(--pink)" : "";
  },
  saveCfg(c){ this.cfg = c; try{ localStorage.setItem("ot-ai", JSON.stringify(c)); }catch(e){} this.indicate(); },
  async chat(messages, maxTokens){
    const p = CONFIG.AI_PROVIDERS[this.cfg.provider] || CONFIG.AI_PROVIDERS.deepseek;
    let res;
    try{
      res = await fetch(p.base+"/chat/completions", {
        method:"POST",
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+this.cfg.key },
        body: JSON.stringify({ model:p.model, messages, temperature:0.5, max_tokens:maxTokens||600 }),
      });
    }catch(e){ throw new Error("网络不通（检查代理/网络后再试）"); }
    if(res.status===401) throw new Error("Key 不对或已失效（401）");
    if(res.status===402) throw new Error("账户余额不足（402），去提供方官网充值");
    if(res.status===429) throw new Error("请求太频繁（429），等几秒再试");
    if(!res.ok){ const t = await res.text(); throw new Error("接口返回 "+res.status+" "+t.slice(0,80)); }
    const d = await res.json();
    const out = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
    return (out||"").trim();
  },
  _check(){
    if(this.ready()) return true;
    UI.openAISettings("先用 AI：粘贴你的 API Key（只存本机浏览器，费用自己可控）");
    return false;
  },
  _bio(){ return (this.cfg && this.cfg.bio) || "未填写"; },

  // 复盘 AI：给被问倒的题生成答题思路，存进题库
  async advice(jobId, rIdx, qIdx, scope){
    if(!this._check()) return;
    const j = STORE.data.jobs.find(x=>x.id===jobId); if(!j) return;
    const r = j.reviews && j.reviews[rIdx]; if(!r) return;
    const q = r.questions[qIdx];
    const stId = scope+"-st-"+(scope==="dt" ? rIdx+"-"+qIdx : qIdx);
    const st = document.getElementById(stId);
    if(st){ st.textContent = "AI 思考中…"; st.className = "ai-status"; }
    try{
      const out = await this.chat([
        { role:"system", content:"你是资深面试教练。只输出干货，不要客套开场白和总结。" },
        { role:"user", content:
          `候选人在【${r.round||"面试"}】被问到：${q}\n岗位：${j.role} @ ${j.company}\n候选人亮点：${this._bio()}\n`+
          `请给答题思路：3-5 条要点，每条一行、每行不超过 25 字；最后另起一行「面试官为什么问：」+ 一句话。` }
      ], 500);
      STORE.addAdvice(jobId, rIdx, q, out);
      if(scope==="dt") UI.openDetail(jobId); else renderResults();
    }catch(e){
      if(st){ st.textContent = "生成失败："+e.message; st.className = "ai-status err"; }
    }
  },
  adviceQB(i){
    const it = (VIEWS._qitems||[])[i]; if(!it) return;
    this.advice(it.jobId, it.ri, it.qi, "qb");
  },

  // BOSS 打招呼语生成
  async greet(jobId, outId="greetOut", stId="greet-st"){
    if(!this._check()) return;
    const j = STORE.data.jobs.find(x=>x.id===jobId); if(!j) return;
    const st = document.getElementById(stId);
    const out = document.getElementById(outId);
    if(st){ st.textContent = "AI 生成中…"; st.className = "ai-status"; }
    try{
      const text = await this.chat([
        { role:"system", content:"你是求职助手。只输出打招呼语本身，不要引号、不要解释。" },
        { role:"user", content:
          `为 BOSS 直聘写一条给招聘者的打招呼语。\n岗位：${j.role} @ ${j.company}${j.city?"（"+j.city+"）":""}\n我的亮点：${this._bio()}\n简历版本：${j.resume||"默认"}\n`+
          `要求：80-140 字，口语自然、不吹嘘，突出 1-2 个与岗位的匹配点，结尾表达进一步沟通的意愿。` }
      ], 300);
      if(out) out.value = text;
      if(st) st.textContent = "";
      if(outId==="greetOut"){ const gs=document.getElementById("greetSave"); if(gs) gs.style.display = ""; }
    }catch(e){
      if(st){ st.textContent = "生成失败："+e.message; st.className = "ai-status err"; }
    }
  },
  greet2(jobId){ this.greet(jobId, "greet2-out", "greet2-st"); },

  /* 闪卡 AI 定制：按我的亮点（+选中岗位）给这道题的答题方向 */
  async flashAdvice(i){
    if(!this._check()) return;
    const q = QBANK_SEED[i]; if(!q) return;
    const j = STORE.data.jobs.find(x=>x.id===VIEWS.prepJobId) || null;
    VIEWS._flashAI = `<div class="ai-box" style="margin-top:8px">AI 正在按你的亮点定制答题方向…</div>`; renderMain();
    try{
      const out = await this.chat([
        { role:"system", content:"你是资深面试教练。只输出干货要点，不要客套开场白和总结。" },
        { role:"user", content:
          `面试题：${q.q}\n我的亮点：${this._bio()}\n`+(j?`目标岗位：${j.role} @ ${j.company}，JD 要点：${(j.jd||"未填写").slice(0,300)}\n`:"")+
          `请给这道题的定制化答题方向：3-5 条要点，每条一行、每行不超过 30 字，紧密结合我的亮点${j?"和目标岗位":""}。` }
      ], 450);
      VIEWS._flashAI = `<div class="ai-box" style="margin-top:8px"><b style="font-size:11px;color:var(--brand)">AI 定制 · ${esc(q.q)}</b>\n${esc(out)}</div>`; renderMain();
    }catch(e){
      VIEWS._flashAI = `<div class="ai-box" style="margin-top:8px;color:var(--bad)">生成失败：${esc(e.message)}</div>`; renderMain();
    }
  },

  /* ── AI 深度分析（学航海志）：面试准备包 + 匹配度分析表，结果存岗位 ── */
  _anaSt(msg, err){
    const st = document.getElementById("ana-st"); if(!st) return;
    st.textContent = msg || ""; st.className = "ai-status" + (err ? " err" : "");
  },
  _anaBusy(busy){
    ["ana-prep-btn","ana-match-btn"].forEach(id=>{
      const b = document.getElementById(id);
      if(b){ b.disabled = busy; b.style.opacity = busy ? ".5" : ""; }
    });
  },
  _anaCtx(j){
    return `岗位：${j.role} @ ${j.company}${j.city?"（"+j.city+"）":""}\nJD 原文：\n${j.jd}\n我的亮点：${this._bio()}\n简历版本：${j.resume||"默认"}${j.notes?"\n备注："+j.notes:""}`;
  },
  async prep(jobId, silent){
    if(!this._check()) return;
    const j = STORE.data.jobs.find(x=>x.id===jobId); if(!j) return;
    if(!j.jd){ this._anaSt("这个岗位还没贴 JD 原文 —— 打开岗位详情 → 编辑 → 把岗位描述粘进「JD 原文」字段", true); return; }
    this._anaBusy(true); this._anaSt("AI 生成中…约 10-30 秒，生成完自动保存到岗位");
    try{
      const out = await this.chat([
        { role:"system", content:"你是资深求职教练。只输出内容本身，不要客套开场白和总结，严格按照【】分节格式输出。" },
        { role:"user", content:
          this._anaCtx(j) +
          `\n\n请生成面试准备包，严格按以下四节输出（每节用【】标题）：\n`+
          `【定制自我介绍】结合 JD 关键词和我的亮点，写一段 120 字内的开场自我介绍\n`+
          `【JD 关键词】这个岗位最看重的 5-8 个关键词，一行列出\n`+
          `【预测问题】5 个最可能被问的问题，一行一个，每个后面用「→」接一句答题要点\n`+
          `【面试前必查】3 条：面试前该查的公司信息/数据/该准备的反问` }
      ], 1000);
      STORE.setAnalysis(jobId, "prep", out);
      if(silent) renderMain(); else UI.openDetail(jobId);
    }catch(e){
      this._anaSt("生成失败："+e.message, true); this._anaBusy(false);
    }
  },
  async match(jobId, silent){
    if(!this._check()) return;
    const j = STORE.data.jobs.find(x=>x.id===jobId); if(!j) return;
    if(!j.jd){ this._anaSt("这个岗位还没贴 JD 原文 —— 打开岗位详情 → 编辑 → 把岗位描述粘进「JD 原文」字段", true); return; }
    this._anaBusy(true); this._anaSt("AI 生成中…约 10-30 秒，生成完自动保存到岗位");
    try{
      const out = await this.chat([
        { role:"system", content:"你是资深求职教练。只输出 markdown 表格本身，不要任何开场白和总结。表格第一行是表头，第二行是分隔行。" },
        { role:"user", content:
          this._anaCtx(j) +
          `\n\n请站在面试官视角做匹配度分析，输出 markdown 表格，三列：面试官关注维度 | 我的简历证据 | 隐患与建议。\n`+
          `要求：4-6 行；「我的简历证据」基于我的亮点写他可能认可的点，没证据就写「简历中未体现」；「隐患与建议」写面试官可能追问什么、我该怎么补，要具体可执行，不写空话。` }
      ], 1000);
      STORE.setAnalysis(jobId, "match", out);
      if(silent) renderMain(); else UI.openDetail(jobId);
    }catch(e){
      this._anaSt("生成失败："+e.message, true); this._anaBusy(false);
    }
  },
};

/* ═══════════ ⑥ IO 导入导出 ═══════════ */
const IO = {
  exportJSON(){
    const blob = new Blob([JSON.stringify(STORE.data,null,2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `job-tracker-备份-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  },
  importJSON(input){
    const file = input.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if(!confirm(`导入「${file.name}」会覆盖当前 ${STORE.data.jobs.length} 条岗位数据，继续？`)) return;
        STORE.replaceAll(d); renderMain(); alert("导入成功，共 "+d.jobs.length+" 条");
      }catch(e){ alert("文件格式不对，导入失败"); }
    };
    r.readAsText(file); input.value="";
  },
  buildCSV(){
    // \ufeff BOM 让 Excel 正确识别 UTF-8 中文
    const head = ["公司","岗位","城市","渠道","DDL","投递日","状态","下一步","薪资","简历版本","备注"];
    const rows = STORE.data.jobs.map(j=>[
      j.company, j.role, j.city||"", j.channel||"", j.deadline||"",
      j.appliedAt? String(j.appliedAt).slice(0,10) : "",
      stageOf(j.status).name, j.next||"", j.salary||"", j.resume||"", j.notes||""
    ]);
    return "\ufeff" + [head, ...rows].map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  },
  exportCSV(){
    const blob = new Blob([this.buildCSV()], {type:"text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `offer-tracker-${new Date().toISOString().slice(0,10)}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  },
  copyText(jobId){
    const j = STORE.data.jobs.find(x=>x.id===jobId); if(!j || !j.greeting) return;
    this._copy(j.greeting);
  },
  copyGreet2(){
    const t = document.getElementById("greet2-out");
    if(t && t.value.trim()) this._copy(t.value.trim());
  },
  _copy(text){
    const done = ()=> alert("已复制，去 BOSS 直接粘贴即可");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(()=>{
        this._fallbackCopy(text); done();
      });
    }else{
      this._fallbackCopy(text); done();
    }
  },
  _fallbackCopy(text){
    const ta = document.createElement("textarea"); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand("copy");
    document.body.removeChild(ta);
  },
  clearAll(){
    if(!confirm("确定清空全部岗位数据？此操作不可恢复（建议先导出备份）")) return;
    STORE.replaceAll({ version:CONFIG.DATA_VERSION, jobs:[] }); renderMain();
  },
};

const THEME = {
  get(){ try{ return localStorage.getItem("ot-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }catch(e){ return "light"; } },
  set(t){ try{ localStorage.setItem("ot-theme", t); }catch(e){} document.body.classList.toggle("dark", t==="dark"); },
  toggle(btn){ const t = this.get()==="dark" ? "light" : "dark"; this.set(t); btn.textContent = t==="dark" ? "☀️" : "🌙"; },
};
const NEWS = {

  load(){
    // 安静挂法：news.json 不存在/为空 → 情报按钮永远不出现，不占界面

    const b = document.getElementById("newsBtn");
    if(b && this.items && this.items.length) b.style.display = "";
  },
};
