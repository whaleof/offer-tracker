<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>樱帖 · 风格样品 v5 · 角框收拢＋月亮章</title>
<style>
/* ============ 樱帖风格样品 v5（9/8 深夜三）· 按玉涵反馈 ============
   ①角框：重新生成的纯卷草版（无月牙），四角裁切、收在角落不伸中央
   ②头顶小圆章：太阳光芒撤掉，章里改成小弦月（她圈的第4图所指）
   ③中央大弦月保留，四周让空看得清
======================================================== */
:root{
  --kinari:#FBF7EC; --sumi:#2C282B; --sumi-mid:#6B625C;
  --shu:#C2416B; --shu-deep:#A83358; --shu-soft:#F5DCE3;
  --kin:#C9A227; --kin-deep:#854F0B; --kin-face:#E8CE74;
  --serif:"Songti SC","Noto Serif SC","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--kinari);color:var(--sumi);font-family:var(--sans);font-size:14px;line-height:1.7;padding:30px 20px 70px}
.wrap{max-width:1080px;margin:0 auto}
h1{font-family:var(--serif);font-size:22px;letter-spacing:2px}
.note{color:var(--sumi-mid);font-size:12.5px;margin:6px 0 26px}
h2{font-family:var(--serif);font-size:16px;margin:34px 0 14px;color:var(--shu-deep)}
.row{display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;color:var(--sumi-mid);max-width:290px;margin-top:10px}
.cardwrap{width:300px;height:460px;position:relative;border-radius:16px;overflow:hidden;filter:drop-shadow(4px 5px 0 rgba(44,40,43,.18))}
.cardwrap svg.inner{position:absolute;inset:0}
.corner{position:absolute;width:150px;height:150px;background-image:url("../generated-images/樱帖资产/复古塔罗牌边框角花装饰件_一图包含四个角件分别位于画面四角__2026-09-08T13-55-58.png");background-size:300px 300px;background-repeat:no-repeat;mix-blend-mode:multiply;pointer-events:none}
.c-tl{left:8px;top:8px;background-position:left top}
.c-tr{right:8px;top:8px;background-position:right top}
.c-bl{left:8px;bottom:8px;background-position:left bottom}
.c-br{right:8px;bottom:8px;background-position:right bottom}
</style>
</head>
<body>
<div class="wrap">
<h1>樱帖 · 风格样品 v5</h1>
<div class="note">角框重新抽了一版：纯卷草＋小花＋星点，没月牙了；四角裁开收拢，中间让给月亮。头顶小圆章按你圈的改成月亮章。</div>

<h2>牌背 · 终形候选</h2>
<div class="row">
<div>
<div class="cardwrap" style="background:#FBF7EC">
  <svg class="inner" viewBox="0 0 300 460" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="cc"><rect width="300" height="460" rx="16"/></clipPath>
      <clipPath id="ic"><circle cx="150" cy="230" r="74"/></clipPath>
    </defs>
    <rect width="300" height="460" fill="#FBF7EC"/>
    <g clip-path="url(#cc)"><g id="net1"></g></g>
    <circle cx="150" cy="230" r="128" fill="none" stroke="#C2416B" stroke-width="3"/>
    <circle cx="150" cy="230" r="118" fill="none" stroke="#C2416B" stroke-width="7" stroke-dasharray="2 7" opacity=".75"/>
    <circle cx="150" cy="230" r="97" fill="none" stroke="#C9A227" stroke-width="1.3"/>
    <circle cx="150" cy="230" r="76" fill="none" stroke="#C2416B" stroke-width="1.8"/>
    <g clip-path="url(#ic)">
      <path d="M150,158 L192.3,288.2 L81.5,207.8 L218.5,207.8 L107.7,288.2 Z" fill="none" stroke="#C2416B" stroke-width="1.2" opacity=".55"/>
    </g>
    <!-- 中央弦月（切面立体） -->
    <path d="M154,164 a68,68 0 1,0 0,132 a52,52 0 1,1 0,-132 z" transform="translate(-5,-3)" fill="#E8CE74"/>
    <path d="M154,164 a68,68 0 1,0 0,132 a52,52 0 1,1 0,-132 z" fill="#C9A227" stroke="#854F0B" stroke-width="2.2"/>
    <path d="M196,206 L197.6,210.8 L202.4,212.4 L197.6,214 L196,218.8 L194.4,214 L189.6,212.4 L194.4,210.8 Z" fill="#C2416B"/>
    <circle cx="204" cy="240" r="2" fill="#C9A227"/>
    <circle cx="188" cy="262" r="1.5" fill="#C9A227"/>
    <!-- 头顶月亮章（原太阳光芒撤掉，章里改小弦月） -->
    <circle cx="150" cy="102" r="21" fill="#FBF7EC" stroke="#C9A227" stroke-width="2"/>
    <path d="M155,91 a11,11 0 1,0 0,22 a8.4,8.4 0 1,1 0,-22 z" fill="#C9A227" stroke="#854F0B" stroke-width="1.4"/>
    <path d="M160,89 L161.2,92.2 L164.4,93.4 L161.2,94.6 L160,97.8 L158.8,94.6 L155.6,93.4 L158.8,92.2 Z" fill="#C2416B"/>
  </svg>
  <i class="corner c-tl"></i><i class="corner c-tr"></i><i class="corner c-bl"></i><i class="corner c-br"></i>
</div>
<div class="cap">纸底版：四个雕花角件收在四角，中央月亮四周全让空；头顶章里现在是月亮＋小星。刻度齿环保留（你说好看的那个）。</div>
</div>

<div>
<div class="cardwrap" style="background:#A83358">
  <svg class="inner" viewBox="0 0 300 460" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="460" fill="#A83358"/>
    <g clip-path="url(#cc)"><g id="net2"></g></g>
    <circle cx="150" cy="230" r="128" fill="none" stroke="#E8CE74" stroke-width="2.6"/>
    <circle cx="150" cy="230" r="118" fill="none" stroke="#F5DCE3" stroke-width="6" stroke-dasharray="2 7" opacity=".8"/>
    <circle cx="150" cy="230" r="97" fill="none" stroke="#E8CE74" stroke-width="1.2"/>
    <circle cx="150" cy="230" r="76" fill="none" stroke="#E8CE74" stroke-width="1.6"/>
    <g clip-path="url(#ic)">
      <path d="M150,158 L192.3,288.2 L81.5,207.8 L218.5,207.8 L107.7,288.2 Z" fill="none" stroke="#F5DCE3" stroke-width="1.1" opacity=".6"/>
    </g>
    <path d="M154,164 a68,68 0 1,0 0,132 a52,52 0 1,1 0,-132 z" transform="translate(-5,-3)" fill="#F5DCE3"/>
    <path d="M154,164 a68,68 0 1,0 0,132 a52,52 0 1,1 0,-132 z" fill="#E8CE74" stroke="#FBF7EC" stroke-width="1.8"/>
    <path d="M196,206 L197.6,210.8 L202.4,212.4 L197.6,214 L196,218.8 L194.4,214 L189.6,212.4 L194.4,210.8 Z" fill="#FBF7EC"/>
    <circle cx="150" cy="102" r="21" fill="#A83358" stroke="#E8CE74" stroke-width="2"/>
    <path d="M155,91 a11,11 0 1,0 0,22 a8.4,8.4 0 1,1 0,-22 z" fill="#E8CE74"/>
    <path d="M160,89 L161.2,92.2 L164.4,93.4 L161.2,94.6 L160,97.8 L158.8,94.6 L155.6,93.4 L158.8,92.2 Z" fill="#FBF7EC"/>
  </svg>
  <i class="corner c-tl"></i><i class="corner c-tr"></i><i class="corner c-bl"></i><i class="corner c-br"></i>
</div>
<div class="cap">深红版：同结构换色。角件用 multiply 压上去会比纸底版暗一档，你对比看哪个当默认。</div>
</div>
</div>

<div class="note" style="margin-top:34px">回我两件事：①这版四角＋月亮章＋中央月，牌背可以定了吗？定了我连同全页星网、小可一起铺进 v1.3。②纸底还是深红当默认？</div>
</div>

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sparkle(x,y,s,c,o){return '<path d="M'+x+','+(y-s)+' L'+(x+s*0.24)+','+(y-s*0.24)+' L'+(x+s)+','+y+' L'+(x+s*0.24)+','+(y+s*0.24)+' L'+x+','+(y+s)+' L'+(x-s*0.24)+','+(y+s*0.24)+' L'+(x-s)+','+y+' L'+(x-s*0.24)+','+(y-s*0.24)+' Z" fill="'+c+'" opacity="'+o+'"/>'}
function scatter(id,seed,n,w,h,c,op){
  var R=mulberry32(seed),s='',pts=[],i,x,y;
  for(i=0;i<n;i++){x=R()*w;y=R()*h;pts.push([x,y])}
  for(i=0;i<pts.length;i++){s+=sparkle(pts[i][0],pts[i][1],1.2+R()*2.2,c,(op||.25)+R()*.25)}
  for(i=0;i+2<pts.length&&i<9;i+=3){
    s+='<polyline points="'+pts[i]+' '+pts[i+1]+' '+pts[i+2]+'" fill="none" stroke="'+c+'" stroke-width=".6" opacity=".25"/>';
  }
  document.getElementById(id).innerHTML=s;
}
scatter('net1',20260915,24,300,460,'#C9A227',.2);
scatter('net2',20260916,24,300,460,'#F5DCE3',.22);
</script>
</body>
