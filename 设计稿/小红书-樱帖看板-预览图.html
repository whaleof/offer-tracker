<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1440px;background:#FBF7EC;font-family:"Microsoft YaHei",sans-serif;color:#2C282B;position:relative;overflow:hidden}
.frame{position:absolute;inset:42px;border:2px double #C9A227;border-radius:18px;box-shadow:inset 0 0 0 8px #FBF7EC, inset 0 0 0 10px #C9A227}
.cap{position:absolute;top:90px;left:0;right:0;text-align:center;font-size:30px;letter-spacing:6px;color:#8a8175}
.cap b{color:#C2416B}
.board{position:absolute;top:180px;left:80px;right:80px;background:#fff;border:2px solid #2C282B;border-radius:18px;box-shadow:7px 7px 0 #2C282B;padding:22px}
.bh{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:2px dashed #e8e2d5;margin-bottom:14px}
.bh b{font-size:26px}
.bh span{font-size:20px;color:#8a8175}
.cols{display:flex;gap:10px}
.col{flex:1}
.ct{font-size:18px;color:#8a8175;text-align:center;margin-bottom:8px;letter-spacing:1px}
.card{background:#FBF7EC;border:1.5px solid #e0d9c8;border-radius:12px;padding:10px 8px;margin-bottom:8px;text-align:center}
.card b{font-size:18px;display:block}
.card span{font-size:15px;color:#8a8175}
.c1{border-left:4px solid #888780}.c2{border-left:4px solid #378ADD}.c3{border-left:4px solid #BA7517}.c4{border-left:4px solid #7F77DD}.c5{border-left:4px solid #639922}
.bottom{position:absolute;bottom:120px;left:0;right:0;text-align:center}
.free{font-size:32px;font-weight:700;color:#2C282B;letter-spacing:3px}
.url{margin-top:16px;font-size:26px;color:#8a8175;letter-spacing:2px}
</style></head><body>
<div class="frame"></div>
<div class="cap">它长这样 · <b>示例数据</b></div>
<div class="board">
  <div class="bh"><b>樱帖 · 秋招看板</b><span>待投 → Offer</span></div>
  <div class="cols">
    <div class="col"><div class="ct">待投递</div>
      <div class="card c1"><b>星辰科技</b><span>AI产品·杭州</span></div>
      <div class="card c1"><b>云图数据</b><span>前端·上海</span></div>
      <div class="card c1"><b>霞光物联</b><span>产品·北京</span></div></div>
    <div class="col"><div class="ct">已投递</div>
      <div class="card c2"><b>光年互联</b><span>产品经理</span></div>
      <div class="card c2"><b>山海网络</b><span>产品运营</span></div></div>
    <div class="col"><div class="ct">笔试</div>
      <div class="card c3"><b>启明智能</b><span>AI产品</span></div>
      <div class="card c3"><b>苍宇游戏</b><span>游戏AI</span></div></div>
    <div class="col"><div class="ct">面试中</div>
      <div class="card c4"><b>南风科技</b><span>前端·杭州</span></div>
      <div class="card c4"><b>青野信息</b><span>AI产品</span></div></div>
    <div class="col"><div class="ct">Offer</div>
      <div class="card c5"><b>拾光软件</b><span>产品·广州</span></div></div>
  </div>
</div>
<div class="bottom">
  <div class="free">📋 牌阵五列 = 你的秋招进度</div>
  <div class="url">打开网页 · 数据只存你电脑</div>
</div>
</body></html>
