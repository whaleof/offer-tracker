    <path d="M250,395 l1.2 3.4 3.4 1.2 -3.4 1.2 -1.2 3.4 -1.2 -3.4 -3.4 -1.2 3.4 -1.2 Z" opacity=".30"/>
  </g>
  <!-- 4 个小圆点 -->
  <g fill="#C9A227">
    <circle cx="105" cy="45"  r="1.4" opacity=".35"/>
    <circle cx="230" cy="180" r="1.5" opacity=".30"/>
    <circle cx="28"  cy="320" r="1.4" opacity=".28"/>
    <circle cx="265" cy="280" r="1.3" opacity=".28"/>
