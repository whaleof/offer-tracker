<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 460" preserveAspectRatio="xMidYMid slice">
  <rect width="300" height="460" fill="#FBF7EC"/>
  <!-- 三条细曲线，原 hero-bg 同源 -->
  <path d="M-10,150 Q120,40 250,130" fill="none" stroke="#C9A227" stroke-width=".8" opacity=".30"/>
  <path d="M-10,250 Q130,170 250,235" fill="none" stroke="#C9A227" stroke-width=".7" opacity=".26"/>
  <path d="M-10,110 Q110,180 250,90" fill="none" stroke="#C2416B" stroke-width=".6" opacity=".18"/>
  <!-- 4 颗星（原 ~50 颗的 1/12，只在边缘散布，不挡内容区） -->
